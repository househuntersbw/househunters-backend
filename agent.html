<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agent Dashboard ‚Äî HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
<script src="js/auth.js"></script>
  <script>
  // VERIFICATION CHECK - Add this to buyer.html, seller.html, agent.html
document.addEventListener('DOMContentLoaded', function() {
  checkVerificationStatus();
});

async function checkVerificationStatus() {
  const userEmail = localStorage.getItem('userEmail');
  
  if (!userEmail) {
    showVerificationError('Please complete registration first.');
    return;
  }
  
  try {
    const response = await fetch(`/https://househunters-backend.onrender.com/check-verification/${userEmail}`);
    const result = await response.json();
    
    if (!result.success || !result.verified) {
      showVerificationError('Please verify your account before accessing the app.');
    }
  } catch (error) {
    showVerificationError('Error checking verification status.');
  }
}

function showVerificationError(message) {
  // Create error popup
  const errorPopup = document.createElement('div');
  errorPopup.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    font-family: Arial, sans-serif;
  `;
  
  errorPopup.innerHTML = `
    <div style="
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      margin: 20px;
    ">
      <div style="font-size: 3rem; margin-bottom: 15px;">üîê</div>
      <h3 style="margin: 0 0 15px 0; color: #333;">Account Verification Required</h3>
      <p style="margin: 0 0 20px 0; color: #666; line-height: 1.4;">${message}</p>
      <button onclick="redirectToVerification()" style="
        background: #000;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      ">Verify Account</button>
      <button onclick="logout()" style="
        background: transparent;
        color: #666;
        border: 1px solid #ddd;
        padding: 12px 24px;
        border-radius: 8px;
        margin-top: 10px;
        cursor: pointer;
        width: 100%;
      ">Logout</button>
    </div>
  `;
  
  document.body.appendChild(errorPopup);
}

function redirectToVerification() {
  window.location.href = 'verify-otp.html';
}

function logout() {
  localStorage.removeItem('userEmail');
  localStorage.removeItem('userRole');
  localStorage.removeItem('pendingVerification');
  window.location.href = 'index.html';
}

</script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-user-secret"></i></div>
        <div>
          <h1>Agent</h1>
          <p class="muted small">Manage properties & clients</p>
        </div>
      </div>
    </header>

    <section class="top-actions grid-4">  <!-- Change to grid-4 -->
  <button class="btn card" onclick="toggleModal('manageListings', true)">
    <i class="fa-solid fa-layer-group"></i><span>Managed</span>
  </button>
  <button class="btn card" onclick="toggleModal('connectedSellers', true)">
    <i class="fa-solid fa-user-check"></i><span>Sellers</span>
  </button>
  <button class="btn card primary" onclick="location.href='create-listing.html'">
    <i class="fas fa-plus"></i><span>Create Listing</span>
  </button>
  <button class="btn card" onclick="toggleModal('newRequest', true)">
    <i class="fa-solid fa-paper-plane"></i><span>Post Request</span>
  </button>
</section>

    <main class="main-content">
      <div class="categories horizontal-scroll">
        <a class="cat" href="properties-feed.html" style="background: #28a745; color: white;"><i class="fas fa-search"></i> Browse All</a>
        <a class="cat" href="apartments.html">Apartment</a>
        <a class="cat" href="standalone.html">Standalone</a>
        <a class="cat" href="multires.html">Multires</a>
        <a class="cat" href="estate.html">Estate</a>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="feed" onclick="openTab('feed')">Feed</button>
        <button class="tab-btn" data-tab="buyers" onclick="openTab('buyers')">Buyers</button>
        <button class="tab-btn" data-tab="sellers" onclick="openTab('sellers')">Sellers</button>
      </div>

      <section id="feed" class="tab-content">
        <h2 class="section-title">Featured Properties</h2>
        <div id="featuredListings" class="listings"></div>
      </section>

      <section id="buyers" class="tab-content" style="display:none;">
        <h2 class="section-title">Buyers</h2>
        <div id="buyersList" class="listings"></div>
      </section>

      <section id="sellers" class="tab-content" style="display:none;">
        <h2 class="section-title">Sellers</h2>
        <div id="sellersList" class="listings"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="agent.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
      <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-cog"></i><span>Manage</span></a>
      <a href="index.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>
  </div>

  <!-- Modals -->
  <div id="manageListings" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('manageListings', false)">◊</button>
      <h3>My Managed Listings</h3>
      <div id="managedListingsContainer"></div>
    </div>
  </div>

  <div id="connectedSellers" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('connectedSellers', false)">√ó</button>
      <h3>Connected Sellers</h3>
      <div id="connectedSellersList"></div>
    </div>
  </div>
  
  <div id="newRequest" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close-btn" onclick="toggleModal('newRequest', false)">◊</button>
    <h3>Post Request</h3>
    <input id="requestTitle" placeholder="Request Title">
    <textarea id="requestDesc" placeholder="What are you looking for?" rows="4"></textarea>
    <select id="requestType">
      <option value="looking-for-sellers">Looking for Sellers</option>
      <option value="looking-for-buyers">Looking for Buyers</option>
      <option value="property-request">Property Request</option>
      <option value="collaboration">Collaboration</option>
    </select>
    <input id="requestBudget" placeholder="Budget (optional)" type="number">
    <input id="requestLocation" placeholder="Location (optional)">
    <div class="row">
      <button class="btn primary" onclick="postAgentRequest()">Post Request</button>
      <button class="btn ghost" onclick="toggleModal('newRequest', false)">Cancel</button>
    </div>
  </div>
</div>

  <script src="script.js" defer></script>
</body>
</html>
