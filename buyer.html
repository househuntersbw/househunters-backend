<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buyer Dashboard - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="global.js"></script>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand"><div class="logo"><i class="fa-solid fa-money-bill"></i></div><div><h1>Buyer Dashboard</h1><p class="muted small">Find your dream property</p></div></div>
        </header>

        <section class="top-actions grid-4">
            <button class="btn card" onclick="toggleModal('savedModal', true); loadSavedListings();"><i class="fa-solid fa-layer-group"></i><span>Saved</span></button>
            <button class="btn card" onclick="toggleModal('agentsModal', true); loadAgentsList();"><i class="fa-solid fa-user-check"></i><span>Agents</span></button>
            <button class="btn card primary" onclick="location.href='create-listing.html'"><i class="fas fa-plus"></i><span>List</span></button>
            <button class="btn card" onclick="toggleModal('requestModal', true)"><i class="fa-solid fa-paper-plane"></i><span>Request</span></button>
        </section>

        <main class="main-content">
            <div class="categories">
                <a class="cat" href="apartments.html">Apartment</a>
                <a class="cat" href="standalone.html">Standalone</a>
                <a class="cat" href="multires.html">Multires</a>
                <a class="cat" href="estate.html">Estate</a>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('feed')">Feed</button>
                <button class="tab-btn" onclick="openTab('agentsTab')">Agents</button>
                <button class="tab-btn" onclick="openTab('sellersTab')">Sellers</button>
            </div>

            <section id="feed" class="tab-content"><h2>Featured Properties</h2><div id="featuredListings" class="listings">Loading...</div></section>
            <section id="agentsTab" class="tab-content" style="display:none;"><h2>Agents</h2><div id="agentsContainer" class="listings">Loading agents...</div></section>
            <section id="sellersTab" class="tab-content" style="display:none;"><h2>Sellers</h2><div id="sellersContainer" class="listings">Loading sellers...</div></section>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>
            <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </nav>
    </div>

    <!-- Saved Modal -->
    <div id="savedModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('savedModal', false)">×</button>
            <h3>Saved Listings</h3>
            <div id="savedContainer" class="listings">Loading...</div>
        </div>
    </div>

    <!-- Agents Modal -->
    <div id="agentsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('agentsModal', false)">×</button>
            <h3>Available Agents</h3>
            <div id="agentsContainerModal" class="listings">Loading...</div>
        </div>
    </div>

    <!-- Request Modal -->
    <div id="requestModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('requestModal', false)">×</button>
            <h3>Post Buyer Request</h3>
            <input id="reqTitle" placeholder="Title">
            <textarea id="reqDesc" placeholder="Description" rows="4"></textarea>
            <select id="reqType">
                <option value="looking-for-property">Looking for Property</option>
                <option value="looking-for-agent">Looking for Agent</option>
            </select>
            <input id="reqBudget" placeholder="Budget">
            <input id="reqLocation" placeholder="Location">
            <div class="row">
                <button class="btn primary" onclick="postBuyerRequest()">Post</button>
                <button class="btn ghost" onclick="toggleModal('requestModal', false)">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Inquiry Modal -->
    <div id="inquiryModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('inquiryModal', false)">×</button>
            <h3>Send Inquiry</h3>
            <p><strong>Regarding:</strong> <span id="inquiryPropertyTitle"></span></p>
            <input type="hidden" id="inquiryPropertyId">
            <input type="hidden" id="inquiryReceiverEmail">
            <input type="hidden" id="inquiryReceiverRole">
            <textarea id="inquiryMessage" rows="4" placeholder="Type your question here..." style="width:100%; margin:12px 0;"></textarea>
            <div class="row">
                <button class="btn primary" onclick="sendInquiry()">Send Message</button>
                <button class="btn ghost" onclick="toggleModal('inquiryModal', false)">Cancel</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const userRole = localStorage.getItem('userRole') || 'buyer';
        const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
        const homeBtn = document.getElementById('smartHomeBtn');
        if (homeBtn) homeBtn.href = homeLinks[userRole];
        
        if (!localStorage.getItem('userEmail')) window.location.href = 'login.html';
        
        loadProperties('all', 'featuredListings');
        
        // Load agents into the modal container when needed
        window.loadAgentsList = function() {
            const container = document.getElementById('agentsContainerModal');
            if (!container) return;
            container.innerHTML = '<div class="listing-card">Loading agents...</div>';
            fetch(`${API_BASE}/users/agents`)
                .then(res => res.json())
                .then(data => {
                    const agents = data.agents || [];
                    if (agents.length === 0) { container.innerHTML = '<div class="listing-card"><p>No agents available.</p></div>'; return; }
                    container.innerHTML = agents.map(a => `
                        <div class="listing-card" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                            <div><h4>${escapeHtml(a.name || a.email.split('@')[0])}</h4><small> ${escapeHtml(a.email)}</small></div>
                            <button class="btn small" onclick="window.location.href='chat.html'">Message</button>
                        </div>
                    `).join('');
                })
                .catch(() => container.innerHTML = '<div class="listing-card"><p>Error loading agents</p></div>');
        };
    });
    </script>
    <script>
    // Debug - Check if functions exist
    document.addEventListener('DOMContentLoaded', function() {
        console.log('=== BUYER PAGE DEBUG ===');
        console.log('saveListing function exists:', typeof window.saveListing);
        console.log('startChat function exists:', typeof window.startChat);
        console.log('openInquiryModal function exists:', typeof window.openInquiryModal);
        
        if (typeof window.saveListing !== 'function') {
            console.error('❌ saveListing is NOT a function!');
        } else {
            console.log('✅ saveListing IS a function');
        }
        
        if (typeof window.startChat !== 'function') {
            console.error('❌ startChat is NOT a function!');
        } else {
            console.log('✅ startChat IS a function');
        }
    });
</script>
</body>
</html>
