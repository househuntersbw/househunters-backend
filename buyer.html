<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Buyer Dashboard - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="global.js"></script>
    <style>
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
        .btn.card { background: #1a1a1a; border: 1px solid #2e2f32; padding: 16px 8px; display: flex; flex-direction: column; gap: 8px; }
        .btn.card i { font-size: 24px; }
        .categories { display: flex; gap: 12px; overflow-x: auto; padding: 16px; }
        .cat { background: #242526; padding: 8px 20px; border-radius: 40px; text-decoration: none; color: white; white-space: nowrap; }
        .tabs { display: flex; border-bottom: 1px solid #2e2f32; }
        .tab-btn { flex: 1; background: none; border: none; padding: 12px; color: #6c6f72; cursor: pointer; }
        .tab-btn.active { color: white; border-bottom: 2px solid white; }
        .tab-content { padding: 16px; }
        .listings { display: flex; flex-direction: column; gap: 12px; }
        .listing-card { background: #1a1a1a; border-radius: 12px; padding: 16px; border: 1px solid #2e2f32; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #1a1a1a; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px; margin-bottom: 12px; background: #242526; border: 1px solid #3e3f42; border-radius: 8px; color: white; }
        .row { display: flex; gap: 12px; margin-top: 16px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #2e2f32; }
        .nav-item { color: #6c6f72; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: white; }
        @media (max-width: 768px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
        .saved-item { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand"><div class="logo"><i class="fa-solid fa-money-bill"></i></div><div><h1>Buyer Dashboard</h1><p class="muted small">Find your dream property</p></div></div>
        </header>

        <section class="top-actions grid-4">
            <button class="btn card" onclick="openSavedModal()"><i class="fa-solid fa-layer-group"></i><span>Saved</span></button>
            <button class="btn card" onclick="openAgentsModal()"><i class="fa-solid fa-user-check"></i><span>Agents</span></button>
            <button class="btn card primary" onclick="location.href='create-listing.html'"><i class="fas fa-plus"></i><span>List</span></button>
            <button class="btn card" onclick="openRequestModal()"><i class="fa-solid fa-paper-plane"></i><span>Request</span></button>
        </section>

        <main class="main-content">
            <div class="categories">
                <a class="cat" href="apartments.html">Apartment</a>
                <a class="cat" href="standalone.html">Standalone</a>
                <a class="cat" href="multires.html">Multires</a>
                <a class="cat" href="estate.html">Estate</a>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('feed')">Feed</button>
                <button class="tab-btn" onclick="openTab('agents')">Agents</button>
                <button class="tab-btn" onclick="openTab('sellers')">Sellers</button>
            </div>

            <section id="feed" class="tab-content"><h2>Featured Properties</h2><div id="featuredListings" class="listings">Loading...</div></section>
            <section id="agents" class="tab-content" style="display:none;"><h2>Agents</h2><div id="agentsList" class="listings">Loading agents...</div></section>
            <section id="sellers" class="tab-content" style="display:none;"><h2>Sellers</h2><div id="sellersList" class="listings">Loading sellers...</div></section>
        </main>
        
    <nav class="bottom-nav">
    <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>
    <a href="chat.html" class="nav-item" id="chatNavBtn"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="settings.html" class="nav-item" id="settingsNavBtn"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
</nav>
    </div>

    <!-- Saved Modal -->
    <div id="savedModal" class="modal">
        <div class="modal-content">
            <button class="btn card" onclick="openSavedListings()"><i class="fa-solid fa-layer-group"></i><span>Saved</span></button>
            <h3>Saved Listings</h3>
            <div id="savedContainer">Loading...</div>
        </div>
    </div>

    <!-- Agents Modal -->
    <div id="agentsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('agentsModal', false)">×</button>
            <h3>Available Agents</h3>
            <div id="agentsContainer">Loading...</div>
        </div>
    </div>

    <!-- Request Modal -->
    <div id="requestModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleModal('requestModal', false)">×</button>
            <h3>Post Buyer Request</h3>
            <input id="reqTitle" placeholder="Title">
            <textarea id="reqDesc" placeholder="Description" rows="4"></textarea>
            <select id="reqType">
                <option value="looking-for-property">Looking for Property</option>
                <option value="looking-for-agent">Looking for Agent</option>
            </select>
            <input id="reqBudget" placeholder="Budget">
            <input id="reqLocation" placeholder="Location">
            <div class="row">
                <button class="btn primary" onclick="postBuyerRequest()">Post</button>
                <button class="btn ghost" onclick="toggleModal('requestModal', false)">Cancel</button>
            </div>
        </div>
    </div>
<!-- Inquiry Modal - Works for Agents, Sellers, Buyers -->
<div id="inquiryModal" class="modal" style="display:none;">
    <div class="modal-content">
        <button class="close-btn" onclick="toggleModal('inquiryModal', false)">×</button>
        <h3>Send Inquiry</h3>
        <p><strong>Regarding:</strong> <span id="inquiryPropertyTitle"></span></p>
        <input type="hidden" id="inquiryPropertyId">
        <input type="hidden" id="inquiryReceiverEmail">
        <input type="hidden" id="inquiryReceiverRole">
        <textarea id="inquiryMessage" rows="4" placeholder="Type your question here..." style="width:100%; margin:12px 0;"></textarea>
        <div class="row">
            <button class="btn primary" onclick="sendInquiry()">Send Message</button>
            <button class="btn ghost" onclick="toggleModal('inquiryModal', false)">Cancel</button>
        </div>
    </div>
</div>
</div>
    <script>
    // Smart home button setup
    document.addEventListener('DOMContentLoaded', function() {
        const userRole = localStorage.getItem('userRole') || 'buyer';
        const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
        const homeBtn = document.getElementById('smartHomeBtn');
        if (homeBtn) {
            homeBtn.setAttribute('href', homeLinks[userRole]);
        }
        
        const currentPage = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-item').forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPage || (href === '#' && currentPage === homeLinks[userRole])) {
                item.classList.add('active');
            }
        });
        
        // Check if user is logged in
        if (!localStorage.getItem('userEmail')) {
            window.location.href = 'login.html';
            return;
        }
        
        // Load properties
        loadProperties('all', 'featuredListings');
    });
    
    // ============ TOP BUTTON FUNCTIONS ============
    
    // Open Saved Listings
    function openSavedListings() {
        toggleModal('manageListings', true);
        loadSavedListings();
    }
    
    // Open Agents Tab
    function openAgentsTab() {
        openTab('agents');
        loadAgentsList();
    }
    
    // Open Sellers Tab
    function openSellersTab() {
        openTab('sellers');
        loadSellersList();
    }
    
    // Open Request Modal
    function openRequestModal() {
        toggleModal('newRequest', true);
    }
    
    // Create Listing button
    function goToCreateListing() {
        window.location.href = 'create-listing.html';
    }
    
    // Post buyer request
    async function postBuyerRequest() {
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName') || 'Buyer';
        const title = document.getElementById('requestTitle').value;
        const description = document.getElementById('requestDesc').value;
        const type = document.getElementById('requestType').value;
        const budget = document.getElementById('requestBudget').value;
        const location = document.getElementById('requestLocation').value;
        if (!title || !description) { alert('Please fill title and description'); return; }
        try {
            const response = await fetch(`${API_BASE}/requests`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, type, budget, location, contactName: userName, postedBy: userEmail })
            });
            const result = await response.json();
            if (result.success) { alert(' Request posted!'); toggleModal('newRequest', false); }
            else alert(' ' + result.message);
        } catch (error) { alert('Network error'); }
    }
    
    // Make all functions global
    window.openSavedListings = openSavedListings;
    window.openAgentsTab = openAgentsTab;
    window.openSellersTab = openSellersTab;
    window.openRequestModal = openRequestModal;
    window.goToCreateListing = goToCreateListing;
    window.postBuyerRequest = postBuyerRequest;
</script>
<script>
    // Fix bottom nav - smart home button
    (function fixBottomNav() {
        const userRole = localStorage.getItem('userRole') || 'buyer';
        const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
        const homeBtn = document.getElementById('smartHomeBtn');
        if (homeBtn) {
            homeBtn.href = homeLinks[userRole];
        }
        
        // Highlight current page
        const currentPage = window.location.pathname.split('/').pop();
        const chatBtn = document.getElementById('chatNavBtn');
        const settingsBtn = document.getElementById('settingsNavBtn');
        
        if (currentPage === 'chat.html' && chatBtn) chatBtn.classList.add('active');
        else if (currentPage === 'settings.html' && settingsBtn) settingsBtn.classList.add('active');
        else if (homeBtn) homeBtn.classList.add('active');
    })();
</script>
</body>
</html>
