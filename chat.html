<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: white;
        }

        .chat-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .chat-header {
            background: #111111;
            border-bottom: 1px solid #2e2f32;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .chat-header h1 {
            font-size: 20px;
            margin: 0;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: none;
            padding: 8px;
        }
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: none;
            padding: 8px;
        }

        /* Main Chat Layout */
        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar - Conversations List */
        .chat-sidebar {
            width: 320px;
            background: #111111;
            border-right: 1px solid #2e2f32;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            font-weight: 600;
            background: #111111;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background: #1a1a1a;
        }
        .chat-item.active {
            background: #1a1a1a;
            border-left: 3px solid white;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .chat-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
            overflow: hidden;
        }
        .chat-area-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            background: #111111;
        }
        .chat-with-name {
            font-weight: 600;
            font-size: 16px;
        }
        .property-info {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            max-width: 70%;
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.received {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 16px;
            border-radius: 20px;
            background: #1a1a1a;
            color: white;
            word-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: white;
            color: black;
        }
        .message-time {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #2e2f32;
            display: flex;
            gap: 12px;
            background: #111111;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2e2f32;
            border-radius: 24px;
            color: white;
            font-size: 14px;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: white;
        }
        .chat-input-area button {
            background: white;
            color: black;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            padding: 40px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #2e2f32;
            z-index: 100;
        }
        .nav-item {
            color: #6c6f72;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: white;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }
            .back-btn {
                display: block;
            }
            .chat-sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 60px;
                width: 85%;
                z-index: 200;
                transition: left 0.3s ease;
                background: #000;
                height: calc(100% - 60px);
            }
            .chat-sidebar.open {
                left: 0;
            }
            .chat-area {
                width: 100%;
            }
            .message {
                max-width: 85%;
            }
            .chat-header .back-btn {
                display: none;
            }
            .chat-header .menu-btn {
                display: block;
            }
        }

        @media (min-width: 769px) {
            .menu-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- Header -->
        <div class="chat-header">
            <button class="menu-btn" id="menuBtn" onclick="openSidebar()">☰</button>
            <button class="back-btn" id="backBtn" onclick="closeSidebar()">←</button>
            <h1>Messages</h1>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <!-- Sidebar - Conversations -->
            <div class="chat-sidebar" id="sidebar">
                <div class="chat-sidebar-header">Conversations</div>
                <div id="conversationsList" class="chat-list">Loading conversations...</div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="chat-area-header" id="chatAreaHeader" style="display: none;">
                    <div>
                        <div class="chat-with-name" id="chatWithName">Select a conversation</div>
                        <div class="property-info" id="propertyInfo"></div>
                    </div>
                </div>
                <div id="messagesArea" class="chat-messages empty-state">
                    Select a conversation to start chatting
                </div>
                <div class="chat-input-area" style="display: none;" id="chatInputArea">
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" id="smartHomeBtn" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
            <a href="chat.html" class="nav-item active"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </nav>
    </div>

    <script>
        const API_BASE = 'https://househunters-backend-1.onrender.com/api';
        let currentUser = { 
            email: localStorage.getItem('userEmail'), 
            name: localStorage.getItem('userName') || 'User' 
        };
        let currentReceiver = null;
        let currentReceiverName = null;
        let refreshInterval = null;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Load all conversations
        async function loadConversations() {
            if (!currentUser.email) return;
            const container = document.getElementById('conversationsList');
            try {
                const res = await fetch(`${API_BASE}/conversations/${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                const conversations = data.conversations || [];
                console.log('Conversations:', conversations.length);
                
                if (conversations.length === 0) {
                    container.innerHTML = '<div class="chat-item" style="justify-content: center;">No conversations yet. Click Chat on any listing to start!</div>';
                    return;
                }
                
                container.innerHTML = conversations.map(c => `
                    <div class="chat-item" onclick="loadMessages('${c.other_user.replace(/'/g, "\\'")}', '${escapeHtml(c.other_user.split('@')[0])}')">
                        <div class="chat-avatar">${c.other_user.charAt(0).toUpperCase()}</div>
                        <div class="chat-info">
                            <div class="chat-name">${escapeHtml(c.other_user.split('@')[0])}</div>
                            <div class="chat-preview">${escapeHtml((c.last_message || 'No messages yet').substring(0, 40))}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                console.error('Load conversations error:', e);
                container.innerHTML = '<div class="chat-item">Error loading conversations</div>';
            }
        }

        // Load messages with a specific user
        async function loadMessages(otherEmail, otherName) {
            console.log('Loading messages with:', otherEmail);
            currentReceiver = otherEmail;
            currentReceiverName = otherName || otherEmail.split('@')[0];
            
            // Update header
            const header = document.getElementById('chatAreaHeader');
            const chatWithName = document.getElementById('chatWithName');
            const propertyInfo = document.getElementById('propertyInfo');
            
            header.style.display = 'block';
            chatWithName.innerHTML = `Chatting with ${escapeHtml(currentReceiverName)}`;
            
            // Check for property info from listing
            const propTitle = localStorage.getItem('chatPropertyTitle');
            if (propTitle) {
                propertyInfo.innerHTML = `Regarding: ${escapeHtml(propTitle)}`;
                localStorage.removeItem('chatPropertyTitle');
            } else {
                propertyInfo.innerHTML = '';
            }
            
            const container = document.getElementById('messagesArea');
            const chatInput = document.getElementById('chatInputArea');
            container.innerHTML = '<div class="empty-state">Loading messages...</div>';
            chatInput.style.display = 'flex';
            
            // On mobile, close sidebar after selecting a conversation
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
            
            try {
                const res = await fetch(`${API_BASE}/messages/${encodeURIComponent(currentUser.email)}/${encodeURIComponent(otherEmail)}`);
                const data = await res.json();
                const messages = data.messages || [];
                console.log('Messages loaded:', messages.length);
                
                if (messages.length === 0) {
                    container.innerHTML = '<div class="empty-state">No messages yet. Send one below!</div>';
                    return;
                }
                
                container.innerHTML = messages.map(m => `
                    <div class="message ${m.sender === currentUser.email ? 'sent' : 'received'}">
                        <div>
                            <div class="message-bubble">${escapeHtml(m.message)}</div>
                            <div class="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } catch(e) {
                console.error('Load messages error:', e);
                container.innerHTML = '<div class="empty-state">Error loading messages</div>';
            }
        }

        // Send a message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) {
                alert('Please enter a message');
                return;
            }
            if (!currentReceiver) {
                alert('Please select a conversation first');
                return;
            }
            
            input.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sender: currentUser.email, 
                        receiver: currentReceiver, 
                        message: msg 
                    })
                });
                const result = await res.json();
                if (result.success) {
                    input.value = '';
                    await loadMessages(currentReceiver, currentReceiverName);
                    await loadConversations();
                } else {
                    alert('Failed to send: ' + result.message);
                }
            } catch(e) {
                console.error('Send error:', e);
                alert('Network error: ' + e.message);
            }
            input.disabled = false;
            input.focus();
        }

        // Sidebar functions for mobile
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        // Auto-open chat when coming from a listing
        async function autoOpenChat() {
            const chatReceiver = localStorage.getItem('chatReceiver');
            if (chatReceiver) {
                const propTitle = localStorage.getItem('chatPropertyTitle') || '';
                console.log('Auto-opening chat with:', chatReceiver);
                
                localStorage.removeItem('chatReceiver');
                
                // Get user's name
                try {
                    const res = await fetch(`${API_BASE}/profile/${encodeURIComponent(chatReceiver)}`);
                    const data = await res.json();
                    const name = data.user?.name || chatReceiver.split('@')[0];
                    setTimeout(() => {
                        loadMessages(chatReceiver, name);
                    }, 500);
                } catch(err) {
                    console.error('Error getting user name:', err);
                    setTimeout(() => {
                        loadMessages(chatReceiver, chatReceiver.split('@')[0]);
                    }, 500);
                }
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Chat page loaded, user:', currentUser.email);
            
            if (!currentUser.email) {
                window.location.href = 'login.html';
                return;
            }
            
            // Load conversations
            await loadConversations();
            
            // Setup navigation
            setupSmartNav();
            initTheme();
            
            // Setup event listeners
            document.getElementById('sendBtn').onclick = sendMessage;
            document.getElementById('messageInput').onkeypress = (e) => {
                if (e.key === 'Enter') sendMessage();
            };
            
            // Auto-open chat from listing
            await autoOpenChat();
            
            // Auto-refresh messages every 5 seconds
            refreshInterval = setInterval(() => {
                if (currentReceiver) {
                    loadMessages(currentReceiver, currentReceiverName);
                    loadConversations();
                }
            }, 5000);
        });
        
        // Cleanup interval on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
