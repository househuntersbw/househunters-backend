<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        .app { height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header {
            background: #1a1a1a;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover { background: #2a2a2a; }
        .logo {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
        }
        
        /* Chat Layout */
        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .conversations-list {
            width: 320px;
            background: #1a1a1a;
            border-right: 1px solid #2e2f32;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .conversations-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
        }
        .conversations-header h2 { font-size: 18px; }
        .conversations {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            cursor: pointer;
            border-bottom: 1px solid #2e2f32;
            transition: background 0.2s;
        }
        .conversation-item:hover { background: #2a2a2a; }
        .conversation-item.active { background: #2a2a2a; }
        .conversation-avatar {
            width: 52px;
            height: 52px;
            background: #242526;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        .conversation-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .conversation-last-message {
            color: #6c6f72;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-time {
            font-size: 11px;
            color: #6c6f72;
        }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
            display: none;
        }
        .chat-area.active { display: flex; }
        .chat-area-header {
            background: #1a1a1a;
            padding: 12px 16px;
            border-bottom: 1px solid #2e2f32;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mobile-back {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .chat-avatar {
            width: 44px;
            height: 44px;
            background: #242526;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .chat-name { font-weight: 600; font-size: 16px; }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            max-width: 75%;
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.received {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 16px;
            border-radius: 20px;
            background: #242526;
            color: white;
            word-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: #ffffff;
            color: #000000;
        }
        .message-time {
            font-size: 10px;
            color: #6c6f72;
            margin-top: 4px;
            margin-left: 8px;
        }
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #2e2f32;
            background: #1a1a1a;
            display: flex;
            gap: 12px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #242526;
            border: 1px solid #3e3f42;
            border-radius: 24px;
            color: white;
            font-size: 15px;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: white;
        }
        .send-btn {
            background: white;
            color: black;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c6f72;
        }
        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #2e2f32;
            z-index: 100;
        }
        .nav-item {
            color: #6c6f72;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: white; }
        
        @media (max-width: 768px) {
            .conversations-list {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 100%;
                z-index: 20;
                transform: translateX(0);
                transition: transform 0.3s;
            }
            .conversations-list.hide {
                transform: translateX(-100%);
            }
            .chat-area {
                width: 100%;
            }
            .mobile-back {
                display: flex;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo"><i class="fa-regular fa-comment-dots"></i></div>
        <h1 style="font-size: 20px;">Messages</h1>
    </div>
    
    <div class="chat-container">
        <!-- Conversations List -->
        <div id="conversationsList" class="conversations-list">
            <div class="conversations-header">
                <h2>Chats</h2>
            </div>
            <div id="conversations" class="conversations">
                <div class="empty-state">
                    <i class="fa-regular fa-comments"></i>
                    <p>No conversations yet</p>
                </div>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div id="chatArea" class="chat-area">
            <div class="chat-area-header">
                <button id="mobileBackBtn" class="mobile-back"><i class="fa-solid fa-arrow-left"></i></button>
                <div id="chatAvatar" class="chat-avatar">--</div>
                <div>
                    <div id="chatUserName" class="chat-name">Select a chat</div>
                </div>
            </div>
            <div id="messagesArea" class="messages-area">
                <div class="empty-state">
                    <i class="fa-regular fa-comment-dots"></i>
                    <p>Select a conversation to start chatting</p>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn" class="send-btn" disabled><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    
    <nav class="bottom-nav">
        <a href="buyer.html" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
        <a href="chat.html" class="nav-item active"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>
</div>

<script>
    const API_BASE = 'https://househunters-backend-1.onrender.com/api';
    let currentUser = null;
    let currentConversation = null;
    let conversations = [];
    let messageInterval = null;

    // Get current user
    function getCurrentUser() {
        return {
            email: localStorage.getItem('userEmail'),
            name: localStorage.getItem('userName') || 'User'
        };
    }

    // Load all conversations for current user
    async function loadConversations() {
        currentUser = getCurrentUser();
        if (!currentUser.email) {
            window.location.href = 'login.html';
            return;
        }
        
        try {
            const response = await fetch(`${API_BASE}/conversations/${encodeURIComponent(currentUser.email)}`);
            const data = await response.json();
            conversations = data.conversations || [];
            
            const container = document.getElementById('conversations');
            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-comments"></i>
                        <p>No conversations yet. Start by contacting a seller or agent!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item" data-email="${conv.other_user}">
                    <div class="conversation-avatar">${getInitials(conv.other_user)}</div>
                    <div class="conversation-info">
                        <div class="conversation-name">${formatName(conv.other_user)}</div>
                        <div class="conversation-last-message">${escapeHtml(conv.last_message || 'No messages yet')}</div>
                    </div>
                    <div class="conversation-time">${formatTime(conv.last_message_time)}</div>
                </div>
            `).join('');
            
            // Add click handlers
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', () => {
                    const email = item.dataset.email;
                    openConversation(email);
                });
            });
            
            // If there's a current conversation, refresh its messages
            if (currentConversation) {
                loadMessages(currentConversation.email);
            }
        } catch (error) {
            console.error('Error loading conversations:', error);
        }
    }

    // Open a conversation
    async function openConversation(otherUserEmail) {
        currentConversation = { email: otherUserEmail };
        
        // Get user name from localStorage or fetch
        const userName = formatName(otherUserEmail);
        document.getElementById('chatUserName').textContent = userName;
        document.getElementById('chatAvatar').textContent = getInitials(otherUserEmail);
        
        // Show chat area
        document.getElementById('chatArea').classList.add('active');
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        
        // On mobile, hide conversations list
        if (window.innerWidth < 768) {
            document.getElementById('conversationsList').classList.add('hide');
        }
        
        // Load messages
        await loadMessages(otherUserEmail);
        
        // Focus on input
        document.getElementById('messageInput').focus();
    }

    // Load messages between current user and selected user
    async function loadMessages(otherUserEmail) {
        const messagesDiv = document.getElementById('messagesArea');
        messagesDiv.innerHTML = '<div class="empty-state"><p>Loading messages...</p></div>';
        
        try {
            const response = await fetch(`${API_BASE}/messages/${encodeURIComponent(currentUser.email)}/${encodeURIComponent(otherUserEmail)}`);
            const data = await response.json();
            const messages = data.messages || [];
            
            if (messages.length === 0) {
                messagesDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-comment-dots"></i>
                        <p>No messages yet. Send a message to start the conversation!</p>
                    </div>
                `;
                return;
            }
            
            messagesDiv.innerHTML = messages.map(msg => `
                <div class="message ${msg.sender === currentUser.email ? 'sent' : 'received'}">
                    <div>
                        <div class="message-bubble">${escapeHtml(msg.message)}</div>
                        <div class="message-time">${formatMessageTime(msg.created_at)}</div>
                    </div>
                </div>
            `).join('');
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (error) {
            console.error('Error loading messages:', error);
            messagesDiv.innerHTML = '<div class="empty-state"><p>Error loading messages. Please try again.</p></div>';
        }
    }

    // Send a message
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        
        if (!message || !currentConversation) return;
        
        input.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender: currentUser.email,
                    receiver: currentConversation.email,
                    message: message
                })
            });
            const result = await response.json();
            
            if (result.success) {
                input.value = '';
                await loadMessages(currentConversation.email);
                await loadConversations(); // Update conversation list
            } else {
                alert('Failed to send message: ' + result.message);
            }
        } catch (error) {
            console.error('Error sending message:', error);
            alert('Network error. Please try again.');
        } finally {
            input.disabled = false;
            input.focus();
        }
    }

    // Helper functions
    function getInitials(email) {
        const name = formatName(email);
        return name.charAt(0).toUpperCase();
    }
    
    function formatName(email) {
        // Try to get from localStorage first
        const savedName = localStorage.getItem(`user_${email}_name`);
        if (savedName) return savedName;
        
        // Otherwise extract from email
        const parts = email.split('@')[0];
        return parts.charAt(0).toUpperCase() + parts.slice(1);
    }
    
    function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 24 * 60 * 60 * 1000) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (diff < 7 * 24 * 60 * 60 * 1000) {
            return date.toLocaleDateString([], { weekday: 'short' });
        } else {
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }
    }
    
    function formatMessageTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Mobile back button
    function initMobile() {
        const backBtn = document.getElementById('mobileBackBtn');
        const conversationsList = document.getElementById('conversationsList');
        
        backBtn.addEventListener('click', () => {
            document.getElementById('chatArea').classList.remove('active');
            conversationsList.classList.remove('hide');
        });
    }
    
    // Auto-refresh messages every 5 seconds
    function startAutoRefresh() {
        if (messageInterval) clearInterval(messageInterval);
        messageInterval = setInterval(() => {
            if (currentConversation) {
                loadMessages(currentConversation.email);
                loadConversations();
            }
        }, 5000);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
        if (!localStorage.getItem('userEmail')) {
            window.location.href = 'login.html';
            return;
        }
        
        await loadConversations();
        initMobile();
        startAutoRefresh();
        
        // Send message on Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
    });
</script>
</body>
</html>
