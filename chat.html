<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="global.js"></script>
    <style>
        .chat-main {
            display: flex;
            height: calc(100vh - 130px);
        }
        .chat-sidebar {
            width: 320px;
            background: #111111;
            border-right: 1px solid #2e2f32;
            display: flex;
            flex-direction: column;
        }
        .chat-sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            font-weight: 600;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background: #1a1a1a;
        }
        .chat-item.active {
            background: #1a1a1a;
            border-left: 3px solid white;
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            background: #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .chat-info {
            flex: 1;
        }
        .chat-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .chat-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }
        .chat-area-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #111111;
        }
        .back-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            max-width: 70%;
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.received {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 16px;
            border-radius: 20px;
            background: #1a1a1a;
            color: white;
        }
        .message.sent .message-bubble {
            background: white;
            color: black;
        }
        .message-time {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
            text-align: right;
        }
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #2e2f32;
            display: flex;
            gap: 12px;
            background: #111111;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2e2f32;
            border-radius: 24px;
            color: white;
        }
        .chat-input-area button {
            background: white;
            color: black;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
        }
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            padding: 40px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #2e2f32;
            z-index: 100;
        }
        .nav-item {
            color: #6c6f72;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: white;
        }
        @media (max-width: 768px) {
            .chat-sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 70px;
                width: 85%;
                z-index: 200;
                transition: left 0.3s ease;
                background: #000;
            }
            .chat-sidebar.open {
                left: 0;
            }
            .chat-area {
                width: 100%;
            }
            .back-btn {
                display: block;
            }
            .message {
                max-width: 85%;
            }
        }
        .app-header {
            background: #1a1a1a;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header h1 {
            margin: 0;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <button class="back-btn" id="mobileBackBtn" onclick="closeSidebar()">←</button>
            <h1>Messages</h1>
        </header>
        
        <div class="chat-main">
            <div class="chat-sidebar" id="sidebar">
                <div class="chat-sidebar-header">Conversations</div>
                <div id="conversationsList" class="chat-list">Loading conversations...</div>
            </div>
            
            <div class="chat-area" id="chatArea">
                <div id="messagesArea" class="chat-messages empty-state">
                    Select a conversation to start chatting
                </div>
                <div class="chat-input-area" style="display: none;" id="chatInputArea">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
        
        <nav class="bottom-nav">
            <a href="#" id="smartHomeBtn" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
            <a href="chat.html" class="nav-item active"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
        </nav>
    </div>

    <script>
        const API_BASE = 'https://househunters-backend-1.onrender.com/api';
        let currentUser = { 
            email: localStorage.getItem('userEmail'), 
            name: localStorage.getItem('userName') || 'User' 
        };
        let currentReceiver = null;
        let refreshInterval = null;
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function loadConversations() {
            if (!currentUser.email) return;
            const container = document.getElementById('conversationsList');
            try {
                const res = await fetch(`${API_BASE}/conversations/${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                const conversations = data.conversations || [];
                if (conversations.length === 0) { 
                    container.innerHTML = '<div class="chat-item">No conversations yet. Start by messaging someone from a listing!</div>'; 
                    return; 
                }
                container.innerHTML = conversations.map(c => `
                    <div class="chat-item" onclick="loadMessages('${c.other_user.replace(/'/g, "\\'")}')">
                        <div class="chat-avatar">${c.other_user.charAt(0).toUpperCase()}</div>
                        <div class="chat-info">
                            <div class="chat-name">${escapeHtml(c.other_user.split('@')[0])}</div>
                            <div class="chat-preview">${escapeHtml((c.last_message || '').substring(0, 40))}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { 
                container.innerHTML = '<div class="chat-item">Error loading conversations</div>';
            }
        }
        
        async function loadMessages(otherEmail) {
            currentReceiver = otherEmail;
            const container = document.getElementById('messagesArea');
            const chatInput = document.getElementById('chatInputArea');
            container.innerHTML = '<div class="empty-state">Loading messages...</div>';
            chatInput.style.display = 'flex';
            
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('mobileBackBtn').style.display = 'block';
            }
            
            try {
                const res = await fetch(`${API_BASE}/messages/${encodeURIComponent(currentUser.email)}/${encodeURIComponent(otherEmail)}`);
                const data = await res.json();
                const messages = data.messages || [];
                if (messages.length === 0) { 
                    container.innerHTML = '<div class="empty-state">No messages yet. Send one below!</div>'; 
                    return; 
                }
                container.innerHTML = messages.map(m => `
                    <div class="message ${m.sender === currentUser.email ? 'sent' : 'received'}">
                        <div>
                            <div class="message-bubble">${escapeHtml(m.message)}</div>
                            <div class="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } catch(e) { 
                container.innerHTML = '<div class="empty-state">Error loading messages</div>';
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg || !currentReceiver) return;
            input.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: currentUser.email, receiver: currentReceiver, message: msg })
                });
                const result = await res.json();
                if (result.success) { 
                    input.value = ''; 
                    await loadMessages(currentReceiver); 
                    await loadConversations(); 
                } else {
                    alert('Failed to send');
                }
            } catch(e) { 
                alert('Network error'); 
            }
            input.disabled = false;
            input.focus();
        }
        
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mobileBackBtn').style.display = 'none';
            document.getElementById('messagesArea').innerHTML = '<div class="empty-state">Select a conversation to start chatting</div>';
            document.getElementById('chatInputArea').style.display = 'none';
            currentReceiver = null;
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser.email) {
                window.location.href = 'login.html';
                return;
            }
            
            loadConversations();
            setupSmartNav();
            initTheme();
            
            document.getElementById('sendBtn').onclick = sendMessage;
            document.getElementById('messageInput').onkeypress = (e) => { 
                if (e.key === 'Enter') sendMessage(); 
            };
            
            const messagesArea = document.getElementById('messagesArea');
            if (messagesArea && window.innerWidth <= 768) {
                messagesArea.onclick = () => {
                    if (!currentReceiver) openSidebar();
                };
            }
            
            refreshInterval = setInterval(() => {
                if (currentReceiver) {
                    loadMessages(currentReceiver);
                    loadConversations();
                }
            }, 5000);
        });
        
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
