<!doctype html><html lang="en"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />  <title>Create Listing — HouseHunters</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <link rel="stylesheet" href="style.css">  <style>    .create-container {      max-width: 600px;      margin: 0 auto;      padding: 20px;      padding-bottom: 80px;    }    .form-card {      background: #1a1a1a;      border-radius: 20px;      padding: 24px;      border: 1px solid #2e2f32;      position: relative;    }    .form-card h3 {      margin: 20px 0 12px 0;      font-size: 18px;    }    .form-card h3:first-of-type {      margin-top: 0;    }    .image-preview-container {      display: grid;      grid-template-columns: repeat(2, 1fr);      gap: 12px;      margin: 15px 0;    }    .image-preview {      position: relative;      aspect-ratio: 1;      border: 2px dashed #444;      border-radius: 12px;      display: flex;      align-items: center;      justify-content: center;      overflow: hidden;      background: #0a0a0a;    }    .image-preview img {      width: 100%;      height: 100%;      object-fit: cover;    }    .image-preview .remove-btn {      position: absolute;      top: 8px;      right: 8px;      background: rgba(0,0,0,0.7);      color: white;      border: none;      border-radius: 50%;      width: 28px;      height: 28px;      cursor: pointer;      font-size: 16px;      display: flex;      align-items: center;      justify-content: center;      z-index: 10;    }    .image-preview .remove-btn:hover {      background: #c62828;    }    .add-image-btn {      aspect-ratio: 1;      border: 2px dashed #666;      border-radius: 12px;      display: flex;      flex-direction: column;      align-items: center;      justify-content: center;      cursor: pointer;      color: #888;      transition: all 0.3s ease;      background: #0a0a0a;    }    .add-image-btn:hover {      border-color: white;      color: white;    }    #map {      height: 250px;      width: 100%;      border: 1px solid #444;      border-radius: 12px;      margin-bottom: 12px;    }    .upload-status {      margin-top: 10px;      padding: 10px;      border-radius: 8px;      text-align: center;      font-size: 14px;    }    .upload-status.success {      background: #1a3a1a;      color: #4caf50;      border: 1px solid #2e7d32;    }    .upload-status.error {      background: #3a1a1a;      color: #ef5350;      border: 1px solid #c62828;    }    .bottom-nav {      position: fixed;      bottom: 0;      left: 0;      right: 0;      background: #1a1a1a;      display: flex;      justify-content: space-around;      padding: 10px;      border-top: 1px solid #2e2f32;      z-index: 100;    }    .nav-item {      color: #6c6f72;      text-decoration: none;      display: flex;      flex-direction: column;      align-items: center;      gap: 4px;      font-size: 11px;    }    .nav-item i {      font-size: 22px;    }    .nav-item.active {      color: white;    }    .form-row {      display: flex;      gap: 12px;      margin-bottom: 16px;    }    .form-row input, .form-row select {      flex: 1;    }    input, textarea, select {      width: 100%;      padding: 12px;      background: #0a0a0a;      border: 1px solid #333;      border-radius: 8px;      color: white;      font-size: 14px;      font-family: inherit;    }    input:focus, textarea:focus, select:focus {      outline: none;      border-color: white;    }    .btn {      padding: 12px 20px;      border-radius: 8px;      font-weight: 600;      cursor: pointer;      border: none;      font-family: inherit;    }    .btn.primary {      background: white;      color: black;      width: 100%;    }    .btn.primary:hover {      background: #ddd;    }    .btn.ghost {      background: transparent;      border: 1px solid #555;      color: white;    }    .btn.ghost:hover {      background: #2a2a2a;    }    .close-btn {      position: absolute;      top: 16px;      right: 16px;      background: #2a2a2a;      border: none;      width: 36px;      height: 36px;      border-radius: 50%;      color: white;      font-size: 20px;      cursor: pointer;    }    .auth-head {      text-align: center;      margin-bottom: 24px;    }    .logo-small {      width: 48px;      height: 48px;      background: white;      border-radius: 50%;      display: flex;      align-items: center;      justify-content: center;      margin: 0 auto 16px;      font-weight: bold;      font-size: 20px;      color: black;    }    .subtext {      color: #888;      font-size: 14px;    }    .stack {      display: flex;      flex-direction: column;      gap: 16px;    }  </style></head><body>  <div class="create-container">    <div class="form-card">      <button class="close-btn" onclick="goBack()">×</button>      <div class="auth-head">        <div class="logo-small">HH</div>        <h1>Create Listing</h1>        <p class="subtext">List your property for sale or rent</p>      </div>      <form id="createListingForm" class="stack" enctype="multipart/form-data">        <h3>Basic Information</h3>        <input type="text" id="title" placeholder="Property Title" required>        <textarea id="description" placeholder="Property Description" rows="4" required></textarea>                <div class="form-row">          <input type="number" id="price" placeholder="Price (Pula)" required>          <select id="type" required>            <option value="">Property Type</option>            <option value="apartments">Apartments</option>            <option value="standalone">Standalone</option>            <option value="multires">Multires</option>            <option value="estate">Estate</option>            <option value="plots">Plots</option>            <option value="farms">Farms</option>          </select>        </div>        <h3>Property Details</h3>        <div class="form-row">          <input type="number" id="bedrooms" placeholder="Bedrooms">          <input type="number" id="bathrooms" placeholder="Bathrooms">          <input type="number" id="area" placeholder="Area (m²)">        </div>        <h3>Location</h3>        <input type="text" id="location" placeholder="Full Address, Botswana" required>                <div>          <div id="map"></div>          <button type="button" class="btn ghost" style="width:100%; margin-top:8px;" onclick="centerMapOnUser()">            <i class="fas fa-location-dot"></i> Use My Location          </button>        </div>        <input type="hidden" id="latitude">        <input type="hidden" id="longitude">        <h3>Property Images (Up to 4)</h3>        <div class="image-preview-container" id="imagePreviewContainer">          <div class="add-image-btn" onclick="document.getElementById('imageUpload').click()">            <i class="fas fa-plus" style="font-size: 28px; margin-bottom: 8px;"></i>            <span>Add Image</span>          </div>        </div>        <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;">                <div id="uploadStatus" class="upload-status" style="display: none;"></div>        <button class="btn primary" type="submit">Create Listing</button>        <div id="formStatus" class="subtext" style="text-align: center; margin-top: 10px;"></div>      </form>    </div>  </div>  <nav class="bottom-nav">    <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>    <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>  </nav>  <script>    const API_BASE = 'https://househunters-backend-1.onrender.com/api';    let uploadedImages = [];    let map;    let marker;    let geocoder;    // ============ GOOGLE MAPS ============    window.initMap = function() {      console.log('initMap called');      const botswanaCenter = { lat: -24.6541, lng: 25.9087 };            const mapElement = document.getElementById('map');      if (!mapElement) {        console.error('Map element not found');        return;      }            map = new google.maps.Map(mapElement, {        center: botswanaCenter,        zoom: 6      });            geocoder = new google.maps.Geocoder();            map.addListener('click', function(e) {        setMarker(e.latLng);        reverseGeocode(e.latLng);      });            if (navigator.geolocation) {        navigator.geolocation.getCurrentPosition(          function(position) {            const userLocation = {              lat: position.coords.latitude,              lng: position.coords.longitude            };            map.setCenter(userLocation);            map.setZoom(14);            setMarker(userLocation);            reverseGeocode(userLocation);          },          function(error) {            console.log('Geolocation error:', error);          }        );      }    };    function setMarker(location) {      if (marker) {        marker.setPosition(location);      } else {        marker = new google.maps.Marker({          position: location,          map: map,          draggable: true        });                marker.addListener('dragend', function() {          reverseGeocode(marker.getPosition());        });      }            document.getElementById('latitude').value = location.lat();      document.getElementById('longitude').value = location.lng();      console.log('📍 Marker set at:', location.lat(), location.lng());    }    function reverseGeocode(latLng) {      geocoder.geocode({ location: latLng }, function(results, status) {        if (status === 'OK' && results[0]) {          document.getElementById('location').value = results[0].formatted_address;        }      });    }    function centerMapOnUser() {      if (!navigator.geolocation) {        alert('❌ Your browser does not support geolocation');        return;      }            const btn = event.target.closest('button');      const originalText = btn.innerHTML;      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting location...';      btn.disabled = true;            navigator.geolocation.getCurrentPosition(        function(position) {          const userLocation = {            lat: position.coords.latitude,            lng: position.coords.longitude          };          map.setCenter(userLocation);          map.setZoom(15);          setMarker(userLocation);          reverseGeocode(userLocation);                    btn.innerHTML = originalText;          btn.disabled = false;          alert('✅ Location detected! Pin placed on map.');        },        function(error) {          btn.innerHTML = originalText;          btn.disabled = false;                    let errorMsg = '';          switch(error.code) {            case error.PERMISSION_DENIED:              errorMsg = 'Location permission denied. Please enable location in your browser settings and refresh.';              break;            case error.POSITION_UNAVAILABLE:              errorMsg = 'Location unavailable. Please enter address manually.';              break;            case error.TIMEOUT:              errorMsg = 'Location request timed out. Please try again.';              break;            default:              errorMsg = 'Unknown error getting location.';          }          alert('❌ ' + errorMsg);          console.error('Geolocation error:', error);        },        {          enableHighAccuracy: true,          timeout: 10000,          maximumAge: 0        }      );    }    // ============ IMAGE UPLOAD ============    function handleImageUpload(e) {      const files = Array.from(e.target.files);      const statusDiv = document.getElementById('uploadStatus');            for (const file of files) {        if (uploadedImages.length >= 4) {          statusDiv.style.display = 'block';          statusDiv.className = 'upload-status error';          statusDiv.innerHTML = '❌ Maximum 4 images allowed';          setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);          break;        }        if (!file.type.startsWith('image/')) {          statusDiv.style.display = 'block';          statusDiv.className = 'upload-status error';          statusDiv.innerHTML = '❌ Please select image files only';          setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);          continue;        }        if (file.size > 5 * 1024 * 1024) {          statusDiv.style.display = 'block';          statusDiv.className = 'upload-status error';          statusDiv.innerHTML = '❌ Image must be less than 5MB';          setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);          continue;        }        uploadedImages.push(file);        updateImagePreviews();                statusDiv.style.display = 'block';        statusDiv.className = 'upload-status success';        statusDiv.innerHTML = `✅ ${file.name} added (${uploadedImages.length}/4)`;        setTimeout(() => { statusDiv.style.display = 'none'; }, 2000);      }            e.target.value = '';    }    function updateImagePreviews() {      const container = document.getElementById('imagePreviewContainer');      container.innerHTML = '';      uploadedImages.forEach((file, index) => {        const previewDiv = document.createElement('div');        previewDiv.className = 'image-preview';                const reader = new FileReader();        reader.onload = function(e) {          previewDiv.innerHTML = `            <img src="${e.target.result}" alt="Preview">            <button type="button" class="remove-btn" onclick="removeImage(${index})">×</button>          `;        };        reader.readAsDataURL(file);                container.appendChild(previewDiv);      });      if (uploadedImages.length < 4) {        const addBtn = document.createElement('div');        addBtn.className = 'add-image-btn';        addBtn.onclick = () => document.getElementById('imageUpload').click();        addBtn.innerHTML = `          <i class="fas fa-plus" style="font-size: 28px; margin-bottom: 8px;"></i>          <span>Add Image</span>        `;        container.appendChild(addBtn);      }    }    function removeImage(index) {      uploadedImages.splice(index, 1);      updateImagePreviews();    }    // ============ FORM SUBMISSION ============    function goBack() {      const role = localStorage.getItem('userRole') || 'buyer';      const pages = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };      window.location.href = pages[role] || 'index.html';    }    // Setup event listeners    document.getElementById('imageUpload').addEventListener('change', handleImageUpload);    document.getElementById('createListingForm').addEventListener('submit', async function(e) {      e.preventDefault();            const userEmail = localStorage.getItem('userEmail');      if (!userEmail) {        alert('❌ Please login to create listings');        window.location.href = 'login.html';        return;      }      // Get form values      const title = document.getElementById('title').value.trim();      const description = document.getElementById('description').value.trim();      const price = document.getElementById('price').value;      const location = document.getElementById('location').value.trim();      const type = document.getElementById('type').value;      const bedrooms = document.getElementById('bedrooms').value;      const bathrooms = document.getElementById('bathrooms').value;      const area = document.getElementById('area').value;      const lat = document.getElementById('latitude').value;      const lng = document.getElementById('longitude').value;      // Validate required fields      if (!title) { alert('❌ Please enter a property title'); return; }      if (!description) { alert('❌ Please enter a description'); return; }      if (!price) { alert('❌ Please enter a price'); return; }      if (!location) { alert('❌ Please enter a location'); return; }      if (!type) { alert('❌ Please select a property type'); return; }            // FIXED: Require at least 1 image      if (uploadedImages.length === 0) {        alert('❌ Please add at least 1 property image');        return;      }      const formData = new FormData();      formData.append('title', title);      formData.append('description', description);      formData.append('price', price);      formData.append('location', location);      formData.append('type', type);      formData.append('postedBy', userEmail);            if (bedrooms) formData.append('bedrooms', bedrooms);      if (bathrooms) formData.append('bathrooms', bathrooms);      if (area) formData.append('area', area);            if (lat && lng) {        formData.append('coordinates', JSON.stringify({ lat: parseFloat(lat), lng: parseFloat(lng) }));      }      // Add images      uploadedImages.forEach(file => {        formData.append('images', file);      });      const statusDiv = document.getElementById('formStatus');      statusDiv.innerHTML = '⏳ Creating listing... Please wait';      statusDiv.style.color = '#ffaa00';      try {        console.log('Sending to:', `${API_BASE}/properties`);                const response = await fetch(`${API_BASE}/properties`, {          method: 'POST',          body: formData        });        const result = await response.json();        console.log('Response:', result);        if (result.success) {          statusDiv.innerHTML = '✅ Listing created successfully! Redirecting...';          statusDiv.style.color = '#4caf50';                    // Reset form          document.getElementById('createListingForm').reset();          uploadedImages = [];          updateImagePreviews();          document.getElementById('latitude').value = '';          document.getElementById('longitude').value = '';          if (marker) {            marker.setMap(null);            marker = null;          }                    setTimeout(() => {            goBack();          }, 2000);        } else {          statusDiv.innerHTML = '❌ ' + (result.message || 'Failed to create listing');          statusDiv.style.color = '#ef5350';          alert('Error: ' + (result.message || 'Unknown error'));        }      } catch (error) {        console.error('Error:', error);        statusDiv.innerHTML = '❌ Network error: ' + error.message;        statusDiv.style.color = '#ef5350';        alert('Network error: ' + error.message);      }    });    // ============ PAGE LOAD ============    document.addEventListener('DOMContentLoaded', function() {      // Smart nav      const role = localStorage.getItem('userRole') || 'buyer';      const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };      const homeBtn = document.getElementById('smartHomeBtn');      if (homeBtn) homeBtn.href = homeLinks[role];            // Apply theme      const isDark = localStorage.getItem('darkMode') !== 'false';      if (isDark) {        document.body.style.backgroundColor = '#000000';        const formCard = document.querySelector('.form-card');        if (formCard) {          formCard.style.backgroundColor = '#1a1a1a';          formCard.style.borderColor = '#2e2f32';        }      }            // Check login      if (!localStorage.getItem('userEmail')) {        alert('Please login to create a listing');        window.location.href = 'login.html';      }    });  </script>    <!-- Google Maps API -->  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDPHjn5Ij49tQKRJSkLdLgPk9WCAE7XYaA&libraries=places&callback=initMap" async defer></script></body></html>
