<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Listing — HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>/* your existing image preview styles - keep them */</style>
</head>
<body>
  <div class="container auth-card">
    <button class="close-btn" onclick="goBack()">×</button>
    <div class="auth-head">
      <div class="logo-small">HH</div>
      <h1>Create Listing</h1>
      <p class="subtext">List your property for sale or rent</p>
    </div>

    <form id="createListingForm" class="stack" enctype="multipart/form-data">
      <!-- Basic Information -->
      <h3>Basic Information</h3>
      <input type="text" id="title" placeholder="Property Title" required>
      <textarea id="description" placeholder="Property Description" rows="4" required></textarea>
      <div class="form-row">
        <input type="number" id="price" placeholder="Price (Pula)" required>
        <select id="type" required>
          <option value="">Property Type</option>
          <option value="apartments">Apartments</option>
          <option value="standalone">Standalone</option>
          <option value="multires">Multires</option>
          <option value="estate">Estate</option>
          <option value="plots">Plots</option>
          <option value="farms">Farms</option>
        </select>
      </div>
      <h3>Property Details</h3>
      <div class="form-row">
        <input type="number" id="bedrooms" placeholder="Bedrooms">
        <input type="number" id="bathrooms" placeholder="Bathrooms">
        <input type="number" id="area" placeholder="Area (m²)">
      </div>
      <h3>Location</h3>
      <input type="text" id="location" placeholder="Full Address, Botswana" required>
      <input type="text" id="contactName" placeholder="Your Name for Contact" required>
      <h3>Property Images (Up to 4)</h3>
      <div class="image-preview-container" id="imagePreviewContainer">
        <div class="add-image-btn" onclick="document.getElementById('imageUpload').click()">
          <i class="fas fa-plus" style="font-size: 24px; margin-bottom: 8px;"></i>
          <span>Add Image</span>
        </div>
      </div>
      <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;" onchange="handleImageUpload(event)">
      <div id="uploadStatus" class="upload-status" style="display: none;"></div>
      <button class="btn primary" type="submit">Create Listing</button>
      <div id="formStatus" class="small muted" style="margin-top: 10px;"></div>
    </form>
  </div>

  <script>
  const API_BASE = 'https://househunters-backend-1.onrender.com';
  let uploadedImages = [];

  function goBack() {
    const role = localStorage.getItem('userRole') || 'seller';
    const pages = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
    window.location.href = pages[role] || 'index.html';
  }

  function handleImageUpload(e) {
    const files = Array.from(e.target.files);
    const status = document.getElementById('uploadStatus');
    files.forEach(file => {
      if (uploadedImages.length >= 4) {
        status.style.display = 'block';
        status.className = 'upload-status error';
        status.innerHTML = '❌ Maximum 4 images allowed';
        return;
      }
      if (!file.type.startsWith('image/')) {
        status.style.display = 'block';
        status.className = 'upload-status error';
        status.innerHTML = '❌ Please select image files only';
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        status.style.display = 'block';
        status.className = 'upload-status error';
        status.innerHTML = '❌ Image size must be less than 5MB';
        return;
      }
      uploadedImages.push(file);
      updateImagePreviews();
      status.style.display = 'block';
      status.className = 'upload-status success';
      status.innerHTML = `✅ ${file.name} added (${uploadedImages.length}/4)`;
      setTimeout(() => status.style.display = 'none', 3000);
    });
    e.target.value = '';
  }

  function updateImagePreviews() {
    const container = document.getElementById('imagePreviewContainer');
    container.innerHTML = '';
    uploadedImages.forEach((file, index) => {
      const previewDiv = document.createElement('div');
      previewDiv.className = 'image-preview';
      const reader = new FileReader();
      reader.onload = function(e) {
        previewDiv.innerHTML = `<img src="${e.target.result}" alt="Preview"><button type="button" class="remove-btn" onclick="removeImage(${index})">×</button>`;
      };
      reader.readAsDataURL(file);
      container.appendChild(previewDiv);
    });
    if (uploadedImages.length < 4) {
      const uploadBtn = document.createElement('div');
      uploadBtn.className = 'add-image-btn';
      uploadBtn.onclick = () => document.getElementById('imageUpload').click();
      uploadBtn.innerHTML = `<i class="fas fa-plus" style="font-size:24px;margin-bottom:8px;"></i><span>Add Image</span>`;
      container.appendChild(uploadBtn);
    }
  }

  function removeImage(index) {
    uploadedImages.splice(index, 1);
    updateImagePreviews();
  }

  document.getElementById('createListingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const userEmail = localStorage.getItem('userEmail');
    if (!userEmail) {
      alert('❌ Please login to create listings');
      window.location.href = 'login.html';
      return;
    }
    const formData = new FormData();
    formData.append('title', document.getElementById('title').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('location', document.getElementById('location').value);
    formData.append('contactName', document.getElementById('contactName').value);
    formData.append('type', document.getElementById('type').value);
    formData.append('postedBy', userEmail);
    if (document.getElementById('bedrooms').value) formData.append('bedrooms', document.getElementById('bedrooms').value);
    if (document.getElementById('bathrooms').value) formData.append('bathrooms', document.getElementById('bathrooms').value);
    if (document.getElementById('area').value) formData.append('area', document.getElementById('area').value);
    uploadedImages.forEach(file => formData.append('images', file));

    const status = document.getElementById('formStatus');
    status.innerHTML = '⏳ Creating listing...';
    status.style.color = 'blue';
    try {
      const response = await fetch(`${API_BASE}/api/properties`, { method: 'POST', body: formData });
      const result = await response.json();
      if (result.success) {
        status.innerHTML = '✅ ' + result.message;
        status.style.color = 'green';
        document.getElementById('createListingForm').reset();
        uploadedImages = [];
        updateImagePreviews();
        setTimeout(() => goBack(), 2000);
      } else {
        status.innerHTML = '❌ ' + result.message;
        status.style.color = 'red';
      }
    } catch (error) {
      status.innerHTML = '❌ Network error: ' + error.message;
      status.style.color = 'red';
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    const userName = localStorage.getItem('userName');
    if (userName) document.getElementById('contactName').value = userName;
  });
  </script>
</body>
</html>
