<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Listing — HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
<script src="js/auth.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDPHjn5Ij49tQKRJSkLdLgPk9WCAE7XYaA&libraries=places&callback=initMap" async defer></script>
  <style>
    .image-preview-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
    .image-preview {
      position: relative;
      aspect-ratio: 1;
      border: 2px dashed #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-preview .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,0,0,0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .add-image-btn {
      aspect-ratio: 1;
      border: 2px dashed #007bff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #007bff;
      transition: all 0.3s ease;
    }
    .add-image-btn:hover {
      background: #f8f9ff;
      border-color: #0056b3;
    }
    #map {
      height: 200px;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .upload-status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-size: 14px;
    }
    .upload-status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .upload-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="container auth-card">
    <button class="close-btn" onclick="goBack()">×</button>

    <div class="auth-head">
      <div class="logo-small">HH</div>
      <h1>Create Listing</h1>
      <p class="subtext">List your property for sale or rent</p>
    </div>

    <form id="createListingForm" class="stack" enctype="multipart/form-data">
      <!-- Basic Information -->
      <h3>Basic Information</h3>
      <input type="text" id="title" placeholder="Property Title" required>
      <textarea id="description" placeholder="Property Description" rows="4" required></textarea>
      
      <div class="form-row">
        <input type="number" id="price" placeholder="Price (Pula)" required>
        <select id="type" required>
          <option value="">Property Type</option>
          <option value="apartments">Apartments</option>
          <option value="standalone">Standalone</option>
          <option value="multires">Multires</option>
          <option value="estate">Estate</option>
          <option value="plots">Plots</option>
          <option value="farms">Farms</option>
        </select>
      </div>

      <!-- Property Details -->
      <h3>Property Details</h3>
      <div class="form-row">
        <input type="number" id="bedrooms" placeholder="Bedrooms">
        <input type="number" id="bathrooms" placeholder="Bathrooms">
        <input type="number" id="area" placeholder="Area (m²)">
      </div>

      <!-- Location -->
      <h3>Location</h3>
      <input type="text" id="location" placeholder="Full Address, Botswana" required>
      <input type="text" id="contactName" placeholder="Your Name for Contact" required>
      
      <!-- Map Section -->
      <div class="section">
        <h3>Location on Map</h3>
        <div id="map"></div>
        <button type="button" class="btn ghost small" onclick="openLocationPicker()">
          <i class="fas fa-map-marker-alt"></i> Pick Location on Map
        </button>
        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">
      </div>

      <!-- Image Upload -->
      <h3>Property Images (Up to 4)</h3>
      <div class="image-preview-container" id="imagePreviewContainer">
        <div class="add-image-btn" onclick="document.getElementById('imageUpload').click()">
          <i class="fas fa-plus" style="font-size: 24px; margin-bottom: 8px;"></i>
          <span>Add Image</span>
        </div>
      </div>
      <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;" onchange="handleImageUpload(event)">
      
      <div id="uploadStatus" class="upload-status" style="display: none;"></div>

      <button class="btn primary" type="submit">Create Listing</button>
      <div id="formStatus" class="small muted" style="margin-top: 10px;"></div>
    </form>
  </div>

  <script>
    let uploadedImages = [];
    let map;
    let marker;
    let geocoder;

    // Initialize map
    function initMap() {
      console.log('Initializing map...');
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: -24.6541, lng: 25.9087 }, // Botswana center
        zoom: 6
      });
      
      geocoder = new google.maps.Geocoder();
      
      // Add click listener to map
      map.addListener('click', function(e) {
        placeMarker(e.latLng);
        updateLocationFromCoordinates(e.latLng);
      });
      
      // Try to get user's current location
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          map.setCenter(userLocation);
          map.setZoom(12);
        }, function(error) {
          console.log('Geolocation failed:', error);
        });
      }
    }

    function placeMarker(location) {
      if (marker) {
        marker.setPosition(location);
      } else {
        marker = new google.maps.Marker({
          position: location,
          map: map,
          draggable: true
        });
        
        marker.addListener('dragend', function() {
          updateLocationFromCoordinates(marker.getPosition());
        });
      }
      
      document.getElementById('latitude').value = location.lat();
      document.getElementById('longitude').value = location.lng();
    }

    function updateLocationFromCoordinates(latLng) {
      geocoder.geocode({ 'location': latLng }, function(results, status) {
        if (status === 'OK') {
          if (results[0]) {
            document.getElementById('location').value = results[0].formatted_address;
          }
        } else {
          console.log('Geocoder failed due to: ' + status);
        }
      });
    }

    function openLocationPicker() {
      alert('📍 Click on the map to set the property location');
    }

    function goBack() {
      const role = localStorage.getItem('userRole') || 'seller';
      const pages = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
      window.location.href = pages[role] || 'index.html';
    }

    // Image upload handling
    function handleImageUpload(e) {
      const files = Array.from(e.target.files);
      const status = document.getElementById('uploadStatus');
      
      files.forEach(file => {
        if (uploadedImages.length >= 4) {
          status.style.display = 'block';
          status.className = 'upload-status error';
          status.innerHTML = '❌ Maximum 4 images allowed';
          return;
        }

        if (!file.type.startsWith('image/')) {
          status.style.display = 'block';
          status.className = 'upload-status error';
          status.innerHTML = '❌ Please select image files only';
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          status.style.display = 'block';
          status.className = 'upload-status error';
          status.innerHTML = '❌ Image size must be less than 5MB';
          return;
        }

        uploadedImages.push(file);
        updateImagePreviews();
        
        status.style.display = 'block';
        status.className = 'upload-status success';
        status.innerHTML = `✅ ${file.name} added (${uploadedImages.length}/4)`;
        
        setTimeout(() => {
          status.style.display = 'none';
        }, 3000);
      });

      // Reset file input
      e.target.value = '';
    }

    function updateImagePreviews() {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = '';

      // Show uploaded images
      uploadedImages.forEach((file, index) => {
        const previewDiv = document.createElement('div');
        previewDiv.className = 'image-preview';
        
        const reader = new FileReader();
        reader.onload = function(e) {
          previewDiv.innerHTML = `
            <img src="${e.target.result}" alt="Preview ${index + 1}">
            <button type="button" class="remove-btn" onclick="removeImage(${index})">×</button>
          `;
        };
        reader.readAsDataURL(file);
        
        container.appendChild(previewDiv);
      });

      // Add upload button if less than 4 images
      if (uploadedImages.length < 4) {
        const uploadBtn = document.createElement('div');
        uploadBtn.className = 'add-image-btn';
        uploadBtn.onclick = () => document.getElementById('imageUpload').click();
        uploadBtn.innerHTML = `
          <i class="fas fa-plus" style="font-size: 24px; margin-bottom: 8px;"></i>
          <span>Add Image</span>
        `;
        container.appendChild(uploadBtn);
      }
    }

    function removeImage(index) {
      uploadedImages.splice(index, 1);
      updateImagePreviews();
    }

    // Form submission
    document.getElementById('createListingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const userEmail = localStorage.getItem('userEmail');
      if (!userEmail) {
        alert('❌ Please login to create listings');
        window.location.href = 'login.html';
        return;
      }

      const latitude = document.getElementById('latitude').value;
      const longitude = document.getElementById('longitude').value;

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('price', document.getElementById('price').value);
      formData.append('location', document.getElementById('location').value);
      formData.append('contactName', document.getElementById('contactName').value);
      formData.append('type', document.getElementById('type').value);
      formData.append('postedBy', userEmail);

      if (document.getElementById('bedrooms').value) {
        formData.append('bedrooms', document.getElementById('bedrooms').value);
      }
      if (document.getElementById('bathrooms').value) {
        formData.append('bathrooms', document.getElementById('bathrooms').value);
      }
      if (document.getElementById('area').value) {
        formData.append('area', document.getElementById('area').value);
      }
      if (latitude && longitude) {
        formData.append('coordinates', JSON.stringify({
          lat: parseFloat(latitude),
          lng: parseFloat(longitude)
        }));
      }

      // Append images
      uploadedImages.forEach(file => {
        formData.append('images', file);
      });

      const status = document.getElementById('formStatus');
      status.innerHTML = '⏳ Creating listing...';
      status.style.color = 'blue';

      try {
        const response = await fetch('/https://househunters-backend-1.onrender.com/properties', {
          method: 'POST',
          body: formData
          // Note: Don't set Content-Type header for FormData - browser will set it automatically with boundary
        });

        const result = await response.json();

        if (result.success) {
          status.innerHTML = '✅ ' + result.message;
          status.style.color = 'green';
          
          // Reset form
          document.getElementById('createListingForm').reset();
          uploadedImages = [];
          updateImagePreviews();
          
          // Redirect after success
          setTimeout(() => {
            goBack();
          }, 2000);
        } else {
          status.innerHTML = '❌ ' + result.message;
          status.style.color = 'red';
        }
      } catch (error) {
        status.innerHTML = '❌ Network error: ' + error.message;
        status.style.color = 'red';
      }
    });

    // Load user's name as default contact name
    document.addEventListener('DOMContentLoaded', function() {
      const userName = localStorage.getItem('userName');
      if (userName) {
        document.getElementById('contactName').value = userName;
      }
    });
  </script>
</body>
</html>
