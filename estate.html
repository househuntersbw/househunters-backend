<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Estate — HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-city"></i></div>
      <div>
        <h1>Estate</h1>
        <p class="muted small">Estate property listings</p>
      </div>
    </div>
  </header>
  <main class="main-content">
    <div class="top-actions">
      <button class="btn primary" onclick="toggleModal('newRequest', true)">Post Request</button>
    </div>
    <div class="categories horizontal-scroll">
      <a class="cat" href="apartments.html">Apartment</a>
      <a class="cat" href="standalone.html">Standalone</a>
      <a class="cat" href="multires.html">Multires</a>
      <a class="cat active" href="estate.html">Estate</a>
      <a class="cat" href="plots.html">Plots</a>
      <a class="cat" href="farms.html">Farms</a>
    </div>
    <h2 class="section-title">Featured Estates</h2>
    <div id="featuredListings" class="listings"></div>
    <h2 class="section-title">All Estates</h2>
    <div id="allListings" class="listings"></div>
  </main>
  <nav class="bottom-nav">
    <a href="buyer.html" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-cog"></i><span>Manage</span></a>
    <a href="index.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
  </nav>
</div>
<div id="newRequest" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close-btn" onclick="toggleModal('newRequest', false)">×</button>
    <h3>Post New Estate Request</h3>
    <input id="newTitle" placeholder="Property Title">
    <input id="newOwner" placeholder="Owner Name">
    <input id="newManager" placeholder="Managed By">
    <textarea id="newDesc" placeholder="Description"></textarea>
    <div class="row">
      <button class="btn primary" onclick="postNewRequest('estate')">Post</button>
      <button class="btn ghost" onclick="toggleModal('newRequest', false)">Cancel</button>
    </div>
  </div>
</div>
<script src="script.js" defer></script>
<script>
// Updated postNewRequest function for property pages
async function postNewRequest(type) {
      const userEmail = localStorage.getItem('userEmail');
      const userName = localStorage.getItem('userName') || 'User';
      if (!userEmail) {
        alert('❌ Please login to post requests');
        window.location.href = 'login.html';
        return;
      }
      const title = document.getElementById('newTitle')?.value || '';
      const description = document.getElementById('newDesc')?.value || '';
      if (!title || !description) {
        alert('❌ Please fill in title and description');
        return;
      }
      const payload = { title, description, type: `looking-for-${type}`, budget: 0, location: 'Botswana', contactName: userName, postedBy: userEmail };
      try {
        const response = await fetch(`${API_BASE}/requests`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.success) {
          alert('✅ Request posted successfully!');
          toggleModal('newRequest', false);
          document.getElementById('newTitle').value = '';
          document.getElementById('newDesc').value = '';
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        alert('❌ Network error: ' + error.message);
      }
    }
  </script>
</body>
</html>
