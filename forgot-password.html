<!doctype html><html lang="en"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>Forgot Password — HouseHunters</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <link rel="stylesheet" href="style.css">  <script src="global.js"></script>  <style>    .container {      max-width: 500px;      margin: 0 auto;      padding: 20px;    }    .auth-card {      background: #1a1a1a;      border-radius: 20px;      padding: 28px 24px;      margin: 40px auto;      border: 1px solid #2e2f32;      position: relative;    }    .auth-head {      text-align: center;      margin-bottom: 24px;    }    .logo-small {      width: 48px;      height: 48px;      background: white;      border-radius: 50%;      display: flex;      align-items: center;      justify-content: center;      margin: 0 auto 16px;      font-weight: bold;      font-size: 20px;      color: black;    }    .close-btn {      position: absolute;      top: 16px;      right: 16px;      background: #2a2a2a;      border: none;      width: 36px;      height: 36px;      border-radius: 50%;      color: white;      font-size: 20px;      cursor: pointer;    }    .step {      margin-top: 20px;    }    .stack {      display: flex;      flex-direction: column;      gap: 16px;    }    input {      width: 100%;      padding: 12px;      background: #0a0a0a;      border: 1px solid #333;      border-radius: 8px;      color: white;      font-size: 14px;    }    input:focus {      outline: none;      border-color: white;    }    .btn {      padding: 12px 24px;      border-radius: 8px;      font-weight: 600;      cursor: pointer;      border: none;      font-family: inherit;    }    .btn.primary {      background: white;      color: black;      width: 100%;    }    .btn.primary:hover {      background: #ddd;    }    .btn.ghost {      background: transparent;      border: 1px solid #555;      color: white;    }    .btn.ghost:hover {      background: #2a2a2a;    }    .btn.small {      padding: 8px 16px;      font-size: 13px;    }    .muted {      color: #888;    }    .small {      font-size: 13px;    }    .back {      text-align: center;      margin-top: 20px;    }    .back a {      color: #888;      text-decoration: none;    }    .back a:hover {      color: white;    }    .resend-otp {      text-align: center;      margin-top: 20px;    }    .status-text {      margin-top: 10px;      text-align: center;      font-size: 13px;    }    .status-text.success {      color: #4caf50;    }    .status-text.error {      color: #ef5350;    }    .status-text.info {      color: #ffaa00;    }  </style></head><body>  <div class="container auth-card">    <button class="close-btn" onclick="location.href='login.html'">×</button>    <div class="auth-head">      <div class="logo-small">HH</div>      <h1>Reset Your Password</h1>      <p class="subtext muted">Enter your email to receive a reset code</p>    </div>    <!-- Step 1: Request Reset -->    <div id="step1" class="step">      <form id="requestResetForm" class="stack">        <input type="email" id="resetEmail" placeholder="Enter your email" required>        <button class="btn primary" type="submit">Send Reset Code</button>      </form>      <div id="step1Status" class="status-text"></div>    </div>    <!-- Step 2: Verify OTP -->    <div id="step2" class="step" style="display: none;">      <p class="small muted">Enter the 6-digit code sent to your email</p>      <form id="verifyResetForm" class="stack">        <input type="text" id="resetOtp" placeholder="Enter 6-digit code" maxlength="6" required>        <button class="btn primary" type="submit">Verify Code</button>      </form>      <div class="resend-otp">        <p class="small muted">Didn't receive the code?</p>        <button id="resendResetOtp" class="btn ghost small">Resend Code</button>      </div>      <div id="step2Status" class="status-text"></div>    </div>    <!-- Step 3: New Password -->    <div id="step3" class="step" style="display: none;">      <p class="small muted">Create your new password</p>      <form id="resetPasswordForm" class="stack">        <input type="password" id="newPassword" placeholder="New password (min 6 characters)" required minlength="6">        <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">        <button class="btn primary" type="submit">Reset Password</button>      </form>      <div id="step3Status" class="status-text"></div>    </div>    <p class="back small muted"><a href="login.html">← Back to Login</a></p>  </div>  <script>    // FIXED: Correct API URL - NO slash before https!    const API_BASE = 'https://househunters-backend-1.onrender.com/api';        document.addEventListener('DOMContentLoaded', function() {      let currentEmail = '';      let currentOtp = '';      // Step 1: Request reset - FIXED URL      document.getElementById('requestResetForm').addEventListener('submit', async function(e) {        e.preventDefault();                const email = document.getElementById('resetEmail').value.trim();        const status = document.getElementById('step1Status');        if (!email) {          status.innerHTML = '❌ Please enter your email';          status.className = 'status-text error';          return;        }        status.innerHTML = '⏳ Sending reset code...';        status.className = 'status-text info';        try {          // FIXED: Removed the slash before https          const response = await fetch(`${API_BASE}/forgot-password`, {            method: 'POST',            headers: {              'Content-Type': 'application/json'            },            body: JSON.stringify({ email: email })          });          const result = await response.json();          if (result.success) {            currentEmail = email;            status.innerHTML = '✅ ' + result.message;            status.className = 'status-text success';                        // Move to step 2            setTimeout(() => {              document.getElementById('step1').style.display = 'none';              document.getElementById('step2').style.display = 'block';            }, 1500);          } else {            status.innerHTML = '❌ ' + result.message;            status.className = 'status-text error';          }        } catch (error) {          status.innerHTML = '❌ Network error: ' + error.message;          status.className = 'status-text error';          console.error('Error:', error);        }      });      // Step 2: Verify OTP - FIXED URL      document.getElementById('verifyResetForm').addEventListener('submit', async function(e) {        e.preventDefault();                const otp = document.getElementById('resetOtp').value.trim();        const status = document.getElementById('step2Status');        if (!otp || otp.length !== 6) {          status.innerHTML = '❌ Please enter a valid 6-digit code';          status.className = 'status-text error';          return;        }        status.innerHTML = '⏳ Verifying code...';        status.className = 'status-text info';        try {          // FIXED: Removed the slash before https          const response = await fetch(`${API_BASE}/verify-reset-otp`, {            method: 'POST',            headers: {              'Content-Type': 'application/json'            },            body: JSON.stringify({ email: currentEmail, otp: otp })          });          const result = await response.json();          if (result.success) {            currentOtp = otp;            status.innerHTML = '✅ ' + result.message;            status.className = 'status-text success';                        // Move to step 3            setTimeout(() => {              document.getElementById('step2').style.display = 'none';              document.getElementById('step3').style.display = 'block';            }, 1500);          } else {            status.innerHTML = '❌ ' + result.message;            status.className = 'status-text error';          }        } catch (error) {          status.innerHTML = '❌ Network error: ' + error.message;          status.className = 'status-text error';          console.error('Error:', error);        }      });      // Resend OTP - FIXED URL      document.getElementById('resendResetOtp').addEventListener('click', async function() {        const status = document.getElementById('step2Status');        status.innerHTML = '⏳ Sending new code...';        status.className = 'status-text info';        try {          // FIXED: Removed the slash before https          const response = await fetch(`${API_BASE}/forgot-password`, {            method: 'POST',            headers: {              'Content-Type': 'application/json'            },            body: JSON.stringify({ email: currentEmail })          });          const result = await response.json();          if (result.success) {            status.innerHTML = '✅ New code sent to your email!';            status.className = 'status-text success';          } else {            status.innerHTML = '❌ ' + result.message;            status.className = 'status-text error';          }        } catch (error) {          status.innerHTML = '❌ Network error: ' + error.message;          status.className = 'status-text error';          console.error('Error:', error);        }      });      // Step 3: Reset password - FIXED URL      document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {        e.preventDefault();                const newPassword = document.getElementById('newPassword').value;        const confirmPassword = document.getElementById('confirmPassword').value;        const status = document.getElementById('step3Status');        if (newPassword.length < 6) {          status.innerHTML = '❌ Password must be at least 6 characters';          status.className = 'status-text error';          return;        }        if (newPassword !== confirmPassword) {          status.innerHTML = '❌ Passwords do not match';          status.className = 'status-text error';          return;        }        status.innerHTML = '⏳ Resetting password...';        status.className = 'status-text info';        try {          // FIXED: Removed the slash before https          const response = await fetch(`${API_BASE}/reset-password`, {            method: 'POST',            headers: {              'Content-Type': 'application/json'            },            body: JSON.stringify({               email: currentEmail,               otp: currentOtp,               newPassword: newPassword             })          });          const result = await response.json();          if (result.success) {            status.innerHTML = '✅ ' + result.message;            status.className = 'status-text success';                        // Redirect to login after success            setTimeout(() => {              alert('✅ Password reset successfully! Please login with your new password.');              window.location.href = 'login.html';            }, 2000);          } else {            status.innerHTML = '❌ ' + result.message;            status.className = 'status-text error';          }        } catch (error) {          status.innerHTML = '❌ Network error: ' + error.message;          status.className = 'status-text error';          console.error('Error:', error);        }      });    });  </script></body></html>
