<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password — HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
  <div class="container auth-card">
    <button class="close-btn" onclick="location.href='login.html'">×</button>

    <div class="auth-head">
      <div class="logo-small">HH</div>
      <h1>Reset Your Password</h1>
      <p class="subtext">Enter your email to receive a reset code</p>
    </div>

    <!-- Step 1: Request Reset -->
    <div id="step1" class="step">
      <form id="requestResetForm" class="stack">
        <input type="email" id="resetEmail" placeholder="Enter your email" required>
        <button class="btn primary" type="submit">Send Reset Code</button>
      </form>
      <div id="step1Status" class="small muted" style="margin-top: 10px;"></div>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="step2" class="step" style="display: none;">
      <p class="small muted">Enter the 6-digit code sent to your email</p>
      <form id="verifyResetForm" class="stack">
        <input type="text" id="resetOtp" placeholder="Enter 6-digit code" maxlength="6" required>
        <button class="btn primary" type="submit">Verify Code</button>
      </form>
      <div class="resend-otp">
        <p class="small muted">Didn't receive the code?</p>
        <button id="resendResetOtp" class="btn ghost small">Resend Code</button>
      </div>
      <div id="step2Status" class="small muted" style="margin-top: 10px;"></div>
    </div>

    <!-- Step 3: New Password -->
    <div id="step3" class="step" style="display: none;">
      <p class="small muted">Create your new password</p>
      <form id="resetPasswordForm" class="stack">
        <input type="password" id="newPassword" placeholder="New password" required minlength="6">
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
        <button class="btn primary" type="submit">Reset Password</button>
      </form>
      <div id="step3Status" class="small muted" style="margin-top: 10px;"></div>
    </div>

    <p class="back small muted"><a href="login.html">← Back to Login</a></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let currentEmail = '';
      let currentOtp = '';

      // Step 1: Request reset
      document.getElementById('requestResetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('resetEmail').value.trim();
        const status = document.getElementById('step1Status');

        if (!email) {
          status.innerHTML = '❌ Please enter your email';
          status.style.color = 'red';
          return;
        }

        try {
          const response = await fetch('/https://househunters-backend-1.onrender.com/forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email })
          });

          const result = await response.json();

          if (result.success) {
            currentEmail = email;
            status.innerHTML = '✅ ' + result.message;
            status.style.color = 'green';
            
            // Move to step 2
            setTimeout(() => {
              document.getElementById('step1').style.display = 'none';
              document.getElementById('step2').style.display = 'block';
            }, 1500);
          } else {
            status.innerHTML = '❌ ' + result.message;
            status.style.color = 'red';
          }
        } catch (error) {
          status.innerHTML = '❌ Network error: ' + error.message;
          status.style.color = 'red';
        }
      });

      // Step 2: Verify OTP
      document.getElementById('verifyResetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const otp = document.getElementById('resetOtp').value.trim();
        const status = document.getElementById('step2Status');

        if (!otp || otp.length !== 6) {
          status.innerHTML = '❌ Please enter a valid 6-digit code';
          status.style.color = 'red';
          return;
        }

        try {
          const response = await fetch('/https://househunters-backend-1.onrender.com/verify-reset-otp', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: currentEmail, otp: otp })
          });

          const result = await response.json();

          if (result.success) {
            currentOtp = otp;
            status.innerHTML = '✅ ' + result.message;
            status.style.color = 'green';
            
            // Move to step 3
            setTimeout(() => {
              document.getElementById('step2').style.display = 'none';
              document.getElementById('step3').style.display = 'block';
            }, 1500);
          } else {
            status.innerHTML = '❌ ' + result.message;
            status.style.color = 'red';
          }
        } catch (error) {
          status.innerHTML = '❌ Network error: ' + error.message;
          status.style.color = 'red';
        }
      });

      // Resend OTP
      document.getElementById('resendResetOtp').addEventListener('click', async function() {
        const status = document.getElementById('step2Status');

        try {
          const response = await fetch('/https://househunters-backend.onrender.com/forgot-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: currentEmail })
          });

          const result = await response.json();

          if (result.success) {
            status.innerHTML = '✅ New code sent to your email!';
            status.style.color = 'green';
          } else {
            status.innerHTML = '❌ ' + result.message;
            status.style.color = 'red';
          }
        } catch (error) {
          status.innerHTML = '❌ Network error: ' + error.message;
          status.style.color = 'red';
        }
      });

      // Step 3: Reset password
      document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const status = document.getElementById('step3Status');

        if (newPassword.length < 6) {
          status.innerHTML = '❌ Password must be at least 6 characters';
          status.style.color = 'red';
          return;
        }

        if (newPassword !== confirmPassword) {
          status.innerHTML = '❌ Passwords do not match';
          status.style.color = 'red';
          return;
        }

        try {
          const response = await fetch('/https://househunters-backend-1.onrender.com/reset-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              email: currentEmail, 
              otp: currentOtp, 
              newPassword: newPassword 
            })
          });

          const result = await response.json();

          if (result.success) {
            status.innerHTML = '✅ ' + result.message;
            status.style.color = 'green';
            
            // Redirect to login after success
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          } else {
            status.innerHTML = '❌ ' + result.message;
            status.style.color = 'red';
          }
        } catch (error) {
          status.innerHTML = '❌ Network error: ' + error.message;
          status.style.color = 'red';
        }
      });
    });
  </script>
</body>
</html>
