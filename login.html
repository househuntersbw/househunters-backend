<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — HouseHunters Botswana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
  <div class="container auth-card" role="main">
    <button class="close-btn" title="Back" onclick="location.href='index.html'">×</button>

    <div class="auth-head">
      <div class="logo-small">HH</div>
      <h1>Welcome back</h1>
      <p class="subtext">Choose an account type and sign in</p>
    </div>

    <div class="role-selector" aria-label="Select role">
      <button class="role-btn" data-role="buyer">Buyer</button>
      <button class="role-btn" data-role="seller">Seller</button>
      <button class="role-btn" data-role="agent">Agent</button>
    </div>

    <form id="loginForm" class="stack" autocomplete="on" novalidate>
      <label class="sr-only" for="userIdentifier">Email or Phone</label>
      <input id="userIdentifier" name="identifier" type="text" placeholder="Email or phone" required>

      <label class="sr-only" for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required>

      <div class="form-row space-between">
        <a class="small muted" href="forgot-password.html">Forgot password?</a>
        <a class="small muted" href="signup.html">Create account</a>
      </div>

      <button class="btn primary" type="submit">Login</button>
    </form>

    <div class="divider">OR</div>

    <div class="phone-login">
      <input id="phoneNumber" type="tel" placeholder="+26771234567" inputmode="tel" />
      <div class="row">
        <button id="sendCodeBtn" class="btn">Send Code</button>
        <button id="verifyCodeBtn" class="btn ghost" style="display:none;">Verify & Login</button>
      </div>
      <input id="verificationCode" type="text" placeholder="Enter OTP" style="display:none;">
      <div id="loginStatus" class="small muted" aria-live="polite"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('loginForm');
    const roles = document.querySelectorAll('.role-btn');
    const loginStatus = document.getElementById('loginStatus');
    
    // Role selection
    roles.forEach(btn => btn.addEventListener('click', () => {
      roles.forEach(r => r.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('userRole', btn.dataset.role);
    }));

    // Form submission
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const identifier = document.getElementById('userIdentifier').value;
        const password = document.getElementById('password').value;
        const selectedRole = document.querySelector('.role-btn.active')?.dataset.role;

        loginStatus.innerHTML = '⏳ Logging in...';
        loginStatus.style.color = 'blue';

        try {
          // Use the correct endpoint - server expects identifier and password
          const response = await fetch('https://househunters-backend-1.onrender.com/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              identifier: identifier, 
              password: password 
            })
          });

          const result = await response.json();

          if (result.success) {
            // Store user data
            localStorage.setItem('userEmail', result.user.email);
            localStorage.setItem('userName', result.user.name);
            localStorage.setItem('userRole', result.user.role);
            localStorage.setItem('userPhone', result.user.phone || '');
            
            // Set verified flag based on server response
            // Note: Server doesn't return verified flag directly, but if login success, they're verified
            localStorage.setItem('verified', 'true');

            loginStatus.innerHTML = '✅ ' + result.message;
            loginStatus.style.color = 'green';

            // Redirect based on role
            setTimeout(() => {
              const pages = { 
                buyer: 'buyer.html', 
                seller: 'seller.html', 
                agent: 'agent.html' 
              };
              window.location.href = pages[result.user.role] || 'index.html';
            }, 1000);

          } else if (result.needsVerification) {
            // User needs verification
            localStorage.setItem('pendingVerification', result.email);
            localStorage.setItem('userEmail', result.email);
            
            loginStatus.innerHTML = '⚠️ ' + result.message;
            loginStatus.style.color = 'orange';
            
            // Redirect to verification page
            setTimeout(() => {
              window.location.href = 'verify-otp.html';
            }, 2000);
            
          } else {
            loginStatus.innerHTML = '❌ ' + result.message;
            loginStatus.style.color = 'red';
          }
        } catch (error) {
          loginStatus.innerHTML = '❌ Network error: ' + error.message;
          loginStatus.style.color = 'red';
        }
      });
    }
  });
</script>
</body>
</html>
