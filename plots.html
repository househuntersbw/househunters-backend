<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plots— HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
  <style>
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: space-around;
      padding: 10px;
      border-top: 1px solid #2e2f32;
      z-index: 100;
    }
    .nav-item {
      color: #6c6f72;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .nav-item i {
      font-size: 22px;
    }
    .nav-item.active {
      color: white;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-building-columns"></i></div>
        <div><h1>Plots</h1><p class="muted small">Plots property listings</p></div>
      </div>
    </header>
    <main class="main-content">
      <div class="top-actions">
        <button class="btn primary" onclick="toggleModal('newRequest', true)">Post Request</button>
      </div>
      <div class="categories horizontal-scroll">
        <a class="cat" href="apartments.html">Apartment</a>
        <a class="cat" href="standalone.html">Standalone</a>
        <a class="cat" href="multires.html">Multires</a>
        <a class="cat" href="estate.html">Estate</a>
        <a class="cat active" href="plots.html">Plots</a>
        <a class="cat" href="farms.html">Farms</a>
      </div>
      <h2 class="section-title">Featured Plots</h2>
      <div id="featuredListings" class="listings"></div>
      <h2 class="section-title">All Plots</h2>
      <div id="allListings" class="listings"></div>
    </main>
    <nav class="bottom-nav">
      <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>
      <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
      <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    </nav>
  </div>
  
  <div id="newRequest" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('newRequest', false)">×</button>
      <h3>Post New Plot Request</h3>
      <input id="newTitle" placeholder="Property Title">
      <textarea id="newDesc" placeholder="Description" rows="4"></textarea>
      <div class="row">
        <button class="btn primary" onclick="postNewRequest('multires')">Post</button>
        <button class="btn ghost" onclick="toggleModal('newRequest', false)">Cancel</button>
      </div>
    </div>
  </div>

  <div id="inquiryModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('inquiryModal', false)">×</button>
      <h3>Send Inquiry</h3>
      <p><strong>Regarding:</strong> <span id="inquiryPropertyTitle"></span></p>
      <input type="hidden" id="inquiryPropertyId">
      <input type="hidden" id="inquiryReceiverEmail">
      <input type="hidden" id="inquiryReceiverRole">
      <textarea id="inquiryMessage" rows="4" placeholder="Type your question here..." style="width:100%; margin:12px 0;"></textarea>
      <div class="row">
        <button class="btn primary" onclick="sendInquiry()">Send Message</button>
        <button class="btn ghost" onclick="toggleModal('inquiryModal', false)">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const propertyType = 'multires';
    
    document.addEventListener('DOMContentLoaded', function() {
      loadProperties(propertyType, 'featuredListings');
      loadProperties(propertyType, 'allListings');
      setupSmartNav();
      initTheme();
    });
    
    async function postNewRequest(type) {
      const userEmail = localStorage.getItem('userEmail');
      const userName = localStorage.getItem('userName') || 'User';
      if (!userEmail) {
        alert('❌ Please login to post requests');
        window.location.href = 'login.html';
        return;
      }
      const title = document.getElementById('newTitle')?.value || '';
      const description = document.getElementById('newDesc')?.value || '';
      if (!title || !description) {
        alert('❌ Please fill in title and description');
        return;
      }
      const payload = { title, description, type: `looking-for-${type}`, budget: 0, location: 'Botswana', contactName: userName, postedBy: userEmail };
      try {
        const response = await fetch(`${API_BASE}/requests`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.success) {
          alert('✅ Request posted successfully!');
          toggleModal('newRequest', false);
          document.getElementById('newTitle').value = '';
          document.getElementById('newDesc').value = '';
        } else {
          alert('❌ ' + result.message);
        }
      } catch (error) {
        alert('❌ Network error: ' + error.message);
      }
    }
  </script>
</body>
</html>
