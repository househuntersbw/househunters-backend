<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
  <div class="container profile-page">
    <button class="close-btn" onclick="location.href='settings.html'">×</button>

    <h1>Your Profile</h1>

    <div class="profile-pic-container">
      <img id="profilePic" src="default-avatar.png" alt="Profile Picture">
      <label for="profileUpload" title="Upload new picture"><i class="fa fa-camera"></i></label>
      <input id="profileUpload" type="file" accept="image/*">
    </div>

    <!-- Loading State -->
    <div id="loading" style="text-align: center; padding: 20px;">
      <p>Loading your profile...</p>
    </div>

    <!-- Profile Form -->
    <form id="profileForm" style="display: none;">
      <div class="section">
        <h2>Username</h2>
        <input id="username" type="text" placeholder="Enter your username" required>
      </div>

      <div class="section">
        <h2>Primary Email</h2>
        <input id="primaryEmail" type="email" placeholder="Primary email" readonly>
        <div id="extraEmails"></div>
        <button id="addEmailBtn" type="button" class="add-btn">+ Add another email</button>
      </div>

      <div class="section">
        <h2>Primary Phone</h2>
        <input id="primaryPhone" type="text" placeholder="+26771234567" required>
        <div id="extraPhones"></div>
        <button id="addPhoneBtn" type="button" class="add-btn">+ Add another phone</button>
      </div>

      <div class="section">
        <h2>Location</h2>
        <input id="location" type="text" placeholder="Your location in Botswana" required>
      </div>

      <div class="section">
        <h2>Account Type</h2>
        <input id="role" type="text" readonly>
      </div>

      <button type="submit" class="btn primary">Save Changes</button>
    </form>

    <!-- Success Message -->
    <div id="successMessage" style="display: none; text-align: center; padding: 20px; background: #d4edda; color: #155724; border-radius: 8px; margin: 20px 0;">
      <p>✅ Profile updated successfully!</p>
    </div>

    <!-- User Details Display -->
    <div class="user-details" id="userDetails" style="display: none;">
      <h2>Your Profile Information</h2>
      <p><strong>Username:</strong> <span id="displayUsername"></span></p>
      <p><strong>Primary Email:</strong> <span id="displayPrimaryEmail"></span></p>
      <p><strong>Primary Phone:</strong> <span id="displayPrimaryPhone"></span></p>
      <p><strong>Location:</strong> <span id="displayLocation"></span></p>
      <p><strong>Account Type:</strong> <span id="displayRole"></span></p>
      <p><strong>Additional Emails:</strong> <span id="displayExtraEmails">None</span></p>
      <p><strong>Additional Phones:</strong> <span id="displayExtraPhones">None</span></p>
      <p><strong>Member Since:</strong> <span id="displayCreatedAt"></span></p>
    </div>
  </div>

 <script>
  document.addEventListener('DOMContentLoaded', function() {
    loadUserProfile();

    // Form submission
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      await updateProfile();
    });
  });

  async function loadUserProfile() {
    const userEmail = localStorage.getItem('userEmail');
    
    if (!userEmail) {
      alert('❌ Please login to view your profile');
      window.location.href = 'login.html';
      return;
    }

    try {
      const response = await fetch(`/https://househunters-backend.onrender.com/profile/${encodeURIComponent(userEmail)}`);
      const result = await response.json();

      if (result.success) {
        displayProfile(result.user);
      } else {
        alert('❌ Error loading profile: ' + result.message);
      }
    } catch (error) {
      alert('❌ Network error: ' + error.message);
    }
  }

  function displayProfile(user) {
    // Hide loading, show form and details
    document.getElementById('loading').style.display = 'none';
    document.getElementById('profileForm').style.display = 'block';
    document.getElementById('userDetails').style.display = 'block';

    // Populate form fields
    document.getElementById('username').value = user.name || '';
    document.getElementById('primaryEmail').value = user.email || '';
    document.getElementById('primaryPhone').value = user.phone || '';
    document.getElementById('location').value = user.location || '';
    document.getElementById('role').value = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : '';

    // Populate display section
    document.getElementById('displayUsername').textContent = user.name || 'Not set';
    document.getElementById('displayPrimaryEmail').textContent = user.email || 'Not set';
    document.getElementById('displayPrimaryPhone').textContent = user.phone || 'Not set';
    document.getElementById('displayLocation').textContent = user.location || 'Not set';
    document.getElementById('displayRole').textContent = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'Not set';
    
    // Format and display dates
    if (user.createdAt) {
      const date = new Date(user.createdAt);
      document.getElementById('displayCreatedAt').textContent = date.toLocaleDateString();
    }

    // Display extra emails
    if (user.extraEmails && user.extraEmails.length > 0) {
      document.getElementById('displayExtraEmails').textContent = user.extraEmails.join(', ');
    } else {
      document.getElementById('displayExtraEmails').textContent = 'None';
    }

    // Display extra phones
    if (user.extraPhones && user.extraPhones.length > 0) {
      document.getElementById('displayExtraPhones').textContent = user.extraPhones.join(', ');
    } else {
      document.getElementById('displayExtraPhones').textContent = 'None';
    }
  }

  async function updateProfile() {
    const userEmail = localStorage.getItem('userEmail');
    const formData = {
      name: document.getElementById('username').value,
      location: document.getElementById('location').value,
      phone: document.getElementById('primaryPhone').value
    };

    // Validate phone format
    if (!/^\+2677\d{7}$/.test(formData.phone)) {
      alert('❌ Please use a valid Botswana number (+2677XXXXXXX)');
      return;
    }

    try {
      const response = await fetch(`/https://househunters-backend-1.onrender.com/profile/${encodeURIComponent(userEmail)}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });

      const result = await response.json();

      if (result.success) {
        // Show success message
        document.getElementById('successMessage').style.display = 'block';
        setTimeout(() => {
          document.getElementById('successMessage').style.display = 'none';
        }, 3000);
        
        // Update displayed data
        displayProfile(result.user);
      } else {
        alert('❌ Error updating profile: ' + result.message);
      }
    } catch (error) {
      alert('❌ Network error: ' + error.message);
    }
  }

  // Add email button
  document.getElementById('addEmailBtn').addEventListener('click', function() {
    alert('📧 Additional emails feature coming soon!');
  });

  // Add phone button
  document.getElementById('addPhoneBtn').addEventListener('click', function() {
    alert('📱 Additional phones feature coming soon!');
  });
</script>
<script src="js/nav.js"></script>
<script>
// js/nav.js - Smart Home Navigation
// Include this file in all pages that have the bottom navigation

function goHome() {
  const userRole = localStorage.getItem('userRole');
  const isVerified = localStorage.getItem('verified');
  const userEmail = localStorage.getItem('userEmail');
  
  // If user is logged in and verified, redirect to role-specific dashboard
  if (userEmail && isVerified === 'true') {
    switch (userRole) {
      case 'buyer':
        window.location.href = 'buyer.html';
        break;
      case 'seller':
        window.location.href = 'seller.html';
        break;
      case 'agent':
        window.location.href = 'agent.html';
        break;
      default:
        window.location.href = 'index.html';
    }
  } else {
    // Not logged in or not verified, go to landing page
    window.location.href = 'index.html';
  }
}

// Attach to all home buttons when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
  const homeButtons = document.querySelectorAll('.nav-home, .home-btn, [data-home-btn]');
  homeButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      goHome();
    });
  });
});
</script>
</body>
</html>
