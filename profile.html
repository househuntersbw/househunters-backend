<!doctype html><html lang="en"><head>  <meta charset="utf-8" />  <meta name="viewport" content="width=device-width,initial-scale=1" />  <title>Profile — HouseHunters</title>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  <link rel="stylesheet" href="css/style.css">  <script src="global.js"></script>  <style>    .profile-container {      max-width: 600px;      margin: 0 auto;      padding: 20px;      padding-bottom: 80px;    }    .profile-card {      background: #1a1a1a;      border-radius: 20px;      padding: 24px;      margin-bottom: 20px;      text-align: center;      border: 1px solid #2e2f32;    }    .profile-pic-wrapper {      position: relative;      width: 120px;      height: 120px;      margin: 0 auto 20px;      cursor: pointer;    }    .profile-pic-wrapper img {      width: 100%;      height: 100%;      border-radius: 50%;      object-fit: cover;      border: 3px solid white;    }    .profile-pic-placeholder {      width: 100%;      height: 100%;      border-radius: 50%;      background: #2a2a2a;      display: flex;      align-items: center;      justify-content: center;      font-size: 48px;      color: #666;      border: 3px solid white;    }    .camera-icon {      position: absolute;      bottom: 5px;      right: 5px;      background: white;      width: 32px;      height: 32px;      border-radius: 50%;      display: flex;      align-items: center;      justify-content: center;      color: black;    }    .info-row {      display: flex;      justify-content: space-between;      align-items: center;      padding: 12px 0;      border-bottom: 1px solid #2e2f32;    }    .info-row:last-child {      border-bottom: none;    }    .info-label {      font-weight: 600;      color: #aaa;    }    .info-value {      color: white;    }    .edit-btn {      background: #2a2a2a;      border: none;      color: white;      padding: 8px 20px;      border-radius: 20px;      cursor: pointer;      margin-top: 16px;    }    .settings-card {      background: #1a1a1a;      border-radius: 16px;      margin-bottom: 16px;      border: 1px solid #2e2f32;      overflow: hidden;    }    .card-header {      padding: 16px;      border-bottom: 1px solid #2e2f32;      font-weight: 600;    }    .settings-item {      display: flex;      justify-content: space-between;      align-items: center;      padding: 16px;      border-bottom: 1px solid #2e2f32;      cursor: pointer;      transition: background 0.2s;    }    .settings-item:last-child {      border-bottom: none;    }    .settings-item:hover {      background: #242526;    }    .settings-item-left {      display: flex;      align-items: center;      gap: 16px;    }    .settings-item-left i {      width: 24px;      color: #888;    }    .modal {      display: none;      position: fixed;      top: 0;      left: 0;      width: 100%;      height: 100%;      background: rgba(0,0,0,0.95);      z-index: 1000;      align-items: center;      justify-content: center;    }    .modal-content {      background: #1a1a1a;      border-radius: 16px;      padding: 24px;      width: 90%;      max-width: 400px;      position: relative;    }    .modal-content h3 {      margin-bottom: 20px;    }    .modal-content input {      width: 100%;      padding: 12px;      background: #242526;      border: 1px solid #3e3f42;      border-radius: 8px;      color: white;      margin-bottom: 16px;    }    .close-modal {      position: absolute;      top: 12px;      right: 16px;      background: none;      border: none;      color: #999;      font-size: 24px;      cursor: pointer;    }    .toast {      position: fixed;      bottom: 80px;      left: 50%;      transform: translateX(-50%);      background: #2e7d32;      color: white;      padding: 10px 20px;      border-radius: 8px;      z-index: 1100;      display: none;      white-space: nowrap;    }    .toast.error {      background: #c62828;    }    .bottom-nav {      position: fixed;      bottom: 0;      left: 0;      right: 0;      background: #1a1a1a;      display: flex;      justify-content: space-around;      padding: 10px;      border-top: 1px solid #2e2f32;      z-index: 100;    }    .nav-item {      color: #6c6f72;      text-decoration: none;      display: flex;      flex-direction: column;      align-items: center;      gap: 4px;      font-size: 11px;    }    .nav-item i {      font-size: 22px;    }    .nav-item.active {      color: white;    }    .row {      display: flex;      gap: 12px;      margin-top: 8px;    }    .btn-primary {      background: white;      color: black;      border: none;      padding: 12px;      border-radius: 8px;      font-weight: 600;      cursor: pointer;      flex: 1;    }    .btn-secondary {      background: #242526;      color: white;      border: 1px solid #444;      padding: 12px;      border-radius: 8px;      font-weight: 600;      cursor: pointer;      flex: 1;    }    .status-text {      font-size: 12px;      margin-top: 8px;      text-align: center;    }  </style></head><body>  <div class="profile-container">    <div class="profile-card">      <div class="profile-pic-wrapper" id="profilePicBtn">        <img id="profileImage" src="" alt="Profile" style="display: none;">        <div id="profilePlaceholder" class="profile-pic-placeholder"><i class="fa-regular fa-user"></i></div>        <div class="camera-icon"><i class="fa-solid fa-camera"></i></div>      </div>      <input type="file" id="fileInput" accept="image/*" style="display: none;">      <div class="info-row">        <span class="info-label">Name</span>        <span class="info-value" id="displayName">Loading...</span>      </div>      <div class="info-row">        <span class="info-label">Email</span>        <span class="info-value" id="displayEmail">Loading...</span>      </div>      <div class="info-row">        <span class="info-label">Phone</span>        <span class="info-value" id="displayPhone">Loading...</span>      </div>      <div class="info-row">        <span class="info-label">Location</span>        <span class="info-value" id="displayLocation">Loading...</span>      </div>      <div class="info-row">        <span class="info-label">Account Type</span>        <span class="info-value" id="displayRole">Loading...</span>      </div>      <div class="info-row">        <span class="info-label">Member Since</span>        <span class="info-value" id="displayCreated">Loading...</span>      </div>      <button class="edit-btn" onclick="openEditModal()">Edit Profile</button>    </div>    <div class="settings-card">      <div class="card-header">Account Settings</div>      <div class="settings-item" onclick="openChangePasswordModal()">        <div class="settings-item-left">          <i class="fa-solid fa-key"></i>          <span>Change Password</span>        </div>        <i class="fa-solid fa-chevron-right" style="color: #888;"></i>      </div>      <div class="settings-item" onclick="openChangePhoneModal()">        <div class="settings-item-left">          <i class="fa-solid fa-phone"></i>          <span>Change Phone Number</span>        </div>        <i class="fa-solid fa-chevron-right" style="color: #888;"></i>      </div>    </div>  </div>  <nav class="bottom-nav">    <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>    <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>    <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>  </nav>  <!-- Edit Profile Modal -->  <div id="editModal" class="modal">    <div class="modal-content">      <button class="close-modal" onclick="closeEditModal()">×</button>      <h3>Edit Profile</h3>      <input type="text" id="editName" placeholder="Full Name">      <input type="text" id="editLocation" placeholder="Location">      <div class="row">        <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>        <button class="btn-primary" onclick="saveProfile()">Save</button>      </div>      <div id="editStatus" class="status-text"></div>    </div>  </div>  <!-- Change Password Modal -->  <div id="passwordModal" class="modal">    <div class="modal-content">      <button class="close-modal" onclick="closePasswordModal()">×</button>      <h3>Change Password</h3>      <input type="password" id="currentPassword" placeholder="Current Password">      <input type="password" id="newPassword" placeholder="New Password (min 6 characters)">      <input type="password" id="confirmPassword" placeholder="Confirm New Password">      <div class="row">        <button class="btn-secondary" onclick="closePasswordModal()">Cancel</button>        <button class="btn-primary" onclick="changePassword()">Update</button>      </div>      <div id="passwordStatus" class="status-text"></div>    </div>  </div>  <!-- Change Phone Modal -->  <div id="phoneModal" class="modal">    <div class="modal-content">      <button class="close-modal" onclick="closePhoneModal()">×</button>      <h3>Change Phone Number</h3>      <input type="tel" id="newPhone" placeholder="+26771234567">      <input type="password" id="phonePassword" placeholder="Current Password">      <div class="row">        <button class="btn-secondary" onclick="closePhoneModal()">Cancel</button>        <button class="btn-primary" onclick="changePhone()">Update Phone</button>      </div>      <div id="phoneStatus" class="status-text"></div>    </div>  </div>  <div id="toast" class="toast"></div>  <script>    const API_BASE = 'https://househunters-backend-1.onrender.com/api';    let currentUserEmail = null;    function showToast(message, isError = false) {      const toast = document.getElementById('toast');      toast.textContent = message;      toast.className = isError ? 'toast error' : 'toast';      toast.style.display = 'block';      setTimeout(() => {        toast.style.display = 'none';      }, 3000);    }    async function loadUserData() {      const email = localStorage.getItem('userEmail');      if (!email) {        window.location.href = 'login.html';        return;      }      currentUserEmail = email;      try {        const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(email)}`);        const data = await response.json();        if (data.success) {          const user = data.user;          document.getElementById('displayName').textContent = user.name || 'Not set';          document.getElementById('displayEmail').textContent = user.email;          document.getElementById('displayPhone').textContent = user.phone || 'Not set';          document.getElementById('displayLocation').textContent = user.location || 'Not set';          document.getElementById('displayRole').textContent = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'Not set';          if (user.created_at) {            const date = new Date(user.created_at);            document.getElementById('displayCreated').textContent = date.toLocaleDateString();          }          document.getElementById('editName').value = user.name || '';          document.getElementById('editLocation').value = user.location || '';          loadProfilePicture(email);        }      } catch (error) {        console.error('Error loading profile:', error);      }    }    async function loadProfilePicture(email) {      try {        const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(email)}/picture`);        const data = await response.json();        if (data.success && data.imageUrl) {          const img = document.getElementById('profileImage');          const placeholder = document.getElementById('profilePlaceholder');          img.src = `https://househunters-backend-1.onrender.com${data.imageUrl}`;          img.style.display = 'block';          placeholder.style.display = 'none';        } else {          document.getElementById('profileImage').style.display = 'none';          document.getElementById('profilePlaceholder').style.display = 'flex';        }      } catch (error) {        console.error('Error loading profile picture:', error);      }    }    document.getElementById('profilePicBtn').onclick = () => {      document.getElementById('fileInput').click();    };    document.getElementById('fileInput').onchange = async (e) => {      const file = e.target.files[0];      if (!file) return;            if (!file.type.startsWith('image/')) {        showToast('Please select an image file', true);        return;      }      if (file.size > 2 * 1024 * 1024) {        showToast('Image must be less than 2MB', true);        return;      }      const formData = new FormData();      formData.append('profilePic', file);      try {        const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUserEmail)}/picture`, {          method: 'POST',          body: formData        });        const result = await response.json();        if (result.success) {          showToast('Profile picture updated!');          loadProfilePicture(currentUserEmail);        } else {          showToast('Failed to upload', true);        }      } catch (error) {        showToast('Network error', true);      }    };    function openEditModal() {      document.getElementById('editModal').style.display = 'flex';      document.getElementById('editStatus').innerHTML = '';    }    function closeEditModal() {      document.getElementById('editModal').style.display = 'none';    }    async function saveProfile() {      const name = document.getElementById('editName').value;      const location = document.getElementById('editLocation').value;      const status = document.getElementById('editStatus');      if (!name) {        status.innerHTML = '❌ Name is required';        status.style.color = '#ff4444';        return;      }      status.innerHTML = '⏳ Saving...';      status.style.color = '#ffaa00';      try {        const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUserEmail)}`, {          method: 'PUT',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ name, location })        });        const result = await response.json();        if (result.success) {          status.innerHTML = '✅ Profile updated!';          status.style.color = '#4caf50';          document.getElementById('displayName').textContent = name;          document.getElementById('displayLocation').textContent = location || 'Not set';          localStorage.setItem('userName', name);          setTimeout(() => closeEditModal(), 1000);        } else {          status.innerHTML = '❌ ' + result.message;          status.style.color = '#ff4444';        }      } catch (error) {        status.innerHTML = '❌ Network error';        status.style.color = '#ff4444';      }    }    function openChangePasswordModal() {      document.getElementById('currentPassword').value = '';      document.getElementById('newPassword').value = '';      document.getElementById('confirmPassword').value = '';      document.getElementById('passwordStatus').innerHTML = '';      document.getElementById('passwordModal').style.display = 'flex';    }    function closePasswordModal() {      document.getElementById('passwordModal').style.display = 'none';    }    async function changePassword() {      const currentPwd = document.getElementById('currentPassword').value;      const newPwd = document.getElementById('newPassword').value;      const confirmPwd = document.getElementById('confirmPassword').value;      const status = document.getElementById('passwordStatus');      if (!currentPwd || !newPwd) {        status.innerHTML = '❌ Please fill all fields';        status.style.color = '#ff4444';        return;      }      if (newPwd.length < 6) {        status.innerHTML = '❌ Password must be at least 6 characters';        status.style.color = '#ff4444';        return;      }      if (newPwd !== confirmPwd) {        status.innerHTML = '❌ Passwords do not match';        status.style.color = '#ff4444';        return;      }      status.innerHTML = '⏳ Verifying...';      status.style.color = '#ffaa00';      try {        const loginResponse = await fetch(`${API_BASE}/login`, {          method: 'POST',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ identifier: currentUserEmail, password: currentPwd })        });        const loginResult = await loginResponse.json();        if (!loginResult.success) {          status.innerHTML = '❌ Current password is incorrect';          status.style.color = '#ff4444';          return;        }        const response = await fetch(`${API_BASE}/reset-password-direct`, {          method: 'POST',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ email: currentUserEmail, newPassword: newPwd })        });        const result = await response.json();        if (result.success) {          status.innerHTML = '✅ Password changed successfully!';          status.style.color = '#4caf50';          setTimeout(() => closePasswordModal(), 1500);        } else {          status.innerHTML = '❌ ' + result.message;          status.style.color = '#ff4444';        }      } catch (error) {        status.innerHTML = '❌ Network error';        status.style.color = '#ff4444';      }    }    function openChangePhoneModal() {      document.getElementById('newPhone').value = '';      document.getElementById('phonePassword').value = '';      document.getElementById('phoneStatus').innerHTML = '';      document.getElementById('phoneModal').style.display = 'flex';    }    function closePhoneModal() {      document.getElementById('phoneModal').style.display = 'none';    }    async function changePhone() {      const newPhone = document.getElementById('newPhone').value.trim();      const password = document.getElementById('phonePassword').value;      const status = document.getElementById('phoneStatus');      if (!newPhone) {        status.innerHTML = '❌ Please enter phone number';        status.style.color = '#ff4444';        return;      }      if (!/^\+2677\d{7}$/.test(newPhone)) {        status.innerHTML = '❌ Use Botswana format: +26771234567';        status.style.color = '#ff4444';        return;      }      if (!password) {        status.innerHTML = '❌ Please enter your password';        status.style.color = '#ff4444';        return;      }      status.innerHTML = '⏳ Verifying...';      status.style.color = '#ffaa00';      try {        const loginResponse = await fetch(`${API_BASE}/login`, {          method: 'POST',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ identifier: currentUserEmail, password })        });        const loginResult = await loginResponse.json();        if (!loginResult.success) {          status.innerHTML = '❌ Incorrect password';          status.style.color = '#ff4444';          return;        }        const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUserEmail)}`, {          method: 'PUT',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ phone: newPhone })        });        const result = await response.json();        if (result.success) {          status.innerHTML = '✅ Phone number updated!';          status.style.color = '#4caf50';          document.getElementById('displayPhone').textContent = newPhone;          setTimeout(() => closePhoneModal(), 1500);        } else {          status.innerHTML = '❌ ' + result.message;          status.style.color = '#ff4444';        }      } catch (error) {        status.innerHTML = '❌ Network error';        status.style.color = '#ff4444';      }    }    document.addEventListener('DOMContentLoaded', () => {      loadUserData();      setupSmartNav();      initTheme();    });  </script></body></html>
