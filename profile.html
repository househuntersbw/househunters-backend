<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — HouseHunters</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container profile-page">
    <button class="close-btn" onclick="location.href='settings.html'">×</button>
    <h1>Your Profile</h1>
    <div class="profile-pic-container">
      <img id="profilePic" src="default-avatar.png" alt="Profile Picture">
      <label for="profileUpload"><i class="fa fa-camera"></i></label>
      <input id="profileUpload" type="file" accept="image/*">
    </div>
    <div id="loading" style="text-align:center; padding:20px;"><p>Loading your profile...</p></div>
    <form id="profileForm" style="display:none;">
      <div class="section"><h2>Username</h2><input id="username" type="text" required></div>
      <div class="section"><h2>Primary Email</h2><input id="primaryEmail" type="email" readonly></div>
      <div class="section"><h2>Primary Phone</h2><input id="primaryPhone" type="text" placeholder="+26771234567" required></div>
      <div class="section"><h2>Location</h2><input id="location" type="text" required></div>
      <div class="section"><h2>Account Type</h2><input id="role" type="text" readonly></div>
      <button type="submit" class="btn primary">Save Changes</button>
    </form>
    <div id="successMessage" style="display:none; text-align:center; padding:20px; background:#d4edda; color:#155724; border-radius:8px; margin:20px 0;"><p>✅ Profile updated successfully!</p></div>
    <div class="user-details" id="userDetails" style="display:none;">
      <h2>Your Profile Information</h2>
      <p><strong>Username:</strong> <span id="displayUsername"></span></p>
      <p><strong>Primary Email:</strong> <span id="displayPrimaryEmail"></span></p>
      <p><strong>Primary Phone:</strong> <span id="displayPrimaryPhone"></span></p>
      <p><strong>Location:</strong> <span id="displayLocation"></span></p>
      <p><strong>Account Type:</strong> <span id="displayRole"></span></p>
      <p><strong>Member Since:</strong> <span id="displayCreatedAt"></span></p>
    </div>
  </div>
  <script>
  const API_BASE = 'https://househunters-backend-1.onrender.com';

  document.addEventListener('DOMContentLoaded', function() { loadUserProfile(); document.getElementById('profileForm').addEventListener('submit', function(e) { e.preventDefault(); updateProfile(); }); });
  async function loadUserProfile() {
    const userEmail = localStorage.getItem('userEmail');
    if (!userEmail) { alert('❌ Please login'); window.location.href='login.html'; return; }
    try {
      const response = await fetch(`${API_BASE}/api/profile/${encodeURIComponent(userEmail)}`);
      const result = await response.json();
      if (result.success) displayProfile(result.user);
      else alert('❌ Error loading profile: '+result.message);
    } catch(error) { alert('❌ Network error: '+error.message); }
  }
  function displayProfile(user) {
    document.getElementById('loading').style.display='none';
    document.getElementById('profileForm').style.display='block';
    document.getElementById('userDetails').style.display='block';
    document.getElementById('username').value = user.name || '';
    document.getElementById('primaryEmail').value = user.email || '';
    document.getElementById('primaryPhone').value = user.phone || '';
    document.getElementById('location').value = user.location || '';
    document.getElementById('role').value = user.role ? user.role.charAt(0).toUpperCase()+user.role.slice(1) : '';
    document.getElementById('displayUsername').textContent = user.name || 'Not set';
    document.getElementById('displayPrimaryEmail').textContent = user.email || 'Not set';
    document.getElementById('displayPrimaryPhone').textContent = user.phone || 'Not set';
    document.getElementById('displayLocation').textContent = user.location || 'Not set';
    document.getElementById('displayRole').textContent = user.role ? user.role.charAt(0).toUpperCase()+user.role.slice(1) : 'Not set';
    if (user.createdAt) document.getElementById('displayCreatedAt').textContent = new Date(user.createdAt).toLocaleDateString();
  }
  async function updateProfile() {
    const userEmail = localStorage.getItem('userEmail');
    const formData = { name: document.getElementById('username').value, location: document.getElementById('location').value, phone: document.getElementById('primaryPhone').value };
    if (!/^\+2677\d{7}$/.test(formData.phone)) { alert('❌ Please use a valid Botswana number (+2677XXXXXXX)'); return; }
    try {
      const response = await fetch(`${API_BASE}/api/profile/${encodeURIComponent(userEmail)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) });
      const result = await response.json();
      if (result.success) {
        document.getElementById('successMessage').style.display='block';
        setTimeout(()=>document.getElementById('successMessage').style.display='none',3000);
        loadUserProfile();
      } else alert('❌ Error updating profile: '+result.message);
    } catch(error) { alert('❌ Network error: '+error.message); }
  }
  </script>
</body>
</html>
