<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">    <title>Seller Dashboard - HouseHunters</title>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <link rel="stylesheet" href="css/style.css">    <script src="global.js"></script></head><body>    <div class="app">        <header class="app-header">            <div class="brand"><div class="logo"><i class="fa-solid fa-user"></i></div><div><h1>Seller Dashboard</h1><p class="muted small">Manage your properties</p></div></div>        </header>        <section class="top-actions grid-4">            <button class="btn card" onclick="openTab('listings'); loadMyListings();"><i class="fa-solid fa-layer-group"></i><span>My Listings</span></button>            <button class="btn card" onclick="openTab('agentsTab'); loadSellerAgentsList();"><i class="fa-solid fa-user-secret"></i><span>Agents</span></button>            <button class="btn card primary" onclick="location.href='create-listing.html'"><i class="fas fa-plus"></i><span>Create</span></button>            <button class="btn card" onclick="toggleModal('requestModal', true)"><i class="fa-solid fa-paper-plane"></i><span>Request</span></button>        </section>        <main class="main-content">            <div class="categories">                <a class="cat" href="apartments.html">Apartment</a>                <a class="cat" href="standalone.html">Standalone</a>                <a class="cat" href="multires.html">Multires</a>                <a class="cat" href="estate.html">Estate</a>            </div>            <div class="tabs">                <button class="tab-btn active" onclick="openTab('listings')">Listings</button>                <button class="tab-btn" onclick="openTab('agentsTab')">Agents</button>                <button class="tab-btn" onclick="openTab('inquiries'); loadInquiries();">Inquiries</button>            </div>            <section id="listings" class="tab-content"><h2>Your Active Listings</h2><div id="myListings" class="listings">Loading...</div></section>            <section id="agentsTab" class="tab-content" style="display:none;"><h2>Available Agents</h2><div id="agentsList" class="listings">Loading agents...</div></section>            <section id="inquiries" class="tab-content" style="display:none;"><h2>Buyer Inquiries</h2><div id="inquiriesList" class="listings">Loading...</div></section>        </main>        <nav class="bottom-nav">            <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>            <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>            <a href="received-requests.html" class="nav-item"><i class="fa-solid fa-inbox"></i><span>Requests</span></a>        </nav>    </div>    <!-- Request Modal -->    <div id="requestModal" class="modal">        <div class="modal-content">            <button class="close-btn" onclick="toggleModal('requestModal', false)">×</button>            <h3>Post Seller Request</h3>            <input id="reqTitle" placeholder="Title">            <textarea id="reqDesc" placeholder="Description" rows="4"></textarea>            <select id="reqType">                <option value="looking-for-agent">Looking for Agent</option>                <option value="looking-for-buyer">Looking for Buyer</option>            </select>            <input id="reqBudget" placeholder="Budget">            <input id="reqLocation" placeholder="Location">            <div class="row">                <button class="btn primary" onclick="postSellerRequest()">Post</button>                <button class="btn ghost" onclick="toggleModal('requestModal', false)">Cancel</button>            </div>        </div>    </div>    <!-- Inquiry Modal -->    <div id="inquiryModal" class="modal">        <div class="modal-content">            <button class="close-btn" onclick="toggleModal('inquiryModal', false)">×</button>            <h3>Send Inquiry</h3>            <p><strong>Regarding:</strong> <span id="inquiryPropertyTitle"></span></p>            <input type="hidden" id="inquiryPropertyId">            <input type="hidden" id="inquiryReceiverEmail">            <input type="hidden" id="inquiryReceiverRole">            <textarea id="inquiryMessage" rows="4" placeholder="Type your question here..." style="width:100%; margin:12px 0;"></textarea>            <div class="row">                <button class="btn primary" onclick="sendInquiry()">Send Message</button>                <button class="btn ghost" onclick="toggleModal('inquiryModal', false)">Cancel</button>            </div>        </div>    </div>    <script>    document.addEventListener('DOMContentLoaded', function() {        const userRole = localStorage.getItem('userRole') || 'seller';        const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };        const homeBtn = document.getElementById('smartHomeBtn');        if (homeBtn) homeBtn.href = homeLinks[userRole];                if (!localStorage.getItem('userEmail')) window.location.href = 'login.html';                loadMyListings();    });    </script></body></html>
