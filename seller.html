<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Dashboard — HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
  <script>
    // SIMPLIFIED VERIFICATION CHECK
    document.addEventListener('DOMContentLoaded', function() {
      // Check if user is verified
      const isVerified = localStorage.getItem('verified');
      const userEmail = localStorage.getItem('userEmail');
      
      console.log('Verification check:', { isVerified, userEmail });
      
      if (!isVerified || !userEmail || isVerified !== 'true') {
        showVerificationError('Please verify your account to access the seller dashboard.');
      }
    });

    function showVerificationError(message) {
      // Create error popup
      const errorPopup = document.createElement('div');
      errorPopup.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-family: Arial, sans-serif;
      `;
      
      errorPopup.innerHTML = `
        <div style="
          background: white;
          padding: 30px;
          border-radius: 12px;
          text-align: center;
          max-width: 300px;
          margin: 20px;
        ">
          <div style="font-size: 3rem; margin-bottom: 15px;"></div>
          <h3 style="margin: 0 0 15px 0; color: #333;">Account Verification Required</h3>
          <p style="margin: 0 0 20px 0; color: #666; line-height: 1.4;">${message}</p>
          <button onclick="redirectToVerification()" style="
            background: #000;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
          ">Verify Account</button>
          <button onclick="logout()" style="
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
            padding: 12px 24px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
          ">Logout</button>
        </div>
      `;
      
      document.body.appendChild(errorPopup);
    }

    function redirectToVerification() {
      window.location.href = 'verify-otp.html';
    }

    function logout() {
      localStorage.removeItem('userEmail');
      localStorage.removeItem('userRole');
      localStorage.removeItem('pendingVerification');
      localStorage.removeItem('verified');
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-user"></i></div>
        <div>
          <h1>Seller</h1>
          <p class="muted small">Manage listings & connect with buyers/agents</p>
        </div>
      </div>
    </header>

    <section class="top-actions grid-4">
  <button class="btn card" onclick="toggleModal('manageListingsModal', true)">
    <i class="fa-solid fa-layer-group"></i><span>Manage</span>
  </button>
  <button class="btn card" onclick="toggleModal('connectedAgents', true)">
    <i class="fa-solid fa-user-secret"></i><span>Agents</span>
  </button>
  <button class="btn card primary" onclick="location.href='create-listing.html'">
    <i class="fas fa-plus"></i><span>Create Listing</span>
  </button>
  <button class="btn card" onclick="toggleModal('sellerRequest', true)">
    <i class="fa-solid fa-paper-plane"></i><span>Post Request</span>
  </button>
</section>

    <main class="main-content">
      <div class="categories horizontal-scroll">
        <a class="cat" href="properties-feed.html" style="background: #28a745; color: white;"><i class="fas fa-search"></i> Browse All</a>
        <a class="cat" href="apartments.html">Apartment</a>
        <a class="cat" href="standalone.html">Standalone</a>
        <a class="cat" href="multires.html">Multires</a>
        <a class="cat" href="estate.html">Estate</a>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="feed" onclick="openTab('feed')">Listings</button>
        <button class="tab-btn" data-tab="agents" onclick="openTab('agents')">Agents</button>
        <button class="tab-btn" data-tab="requests" onclick="openTab('requests')">Requests</button>
      </div>

      <section id="feed" class="tab-content">
        <h2 class="section-title">Your Listings</h2>
        <div id="allListings" class="listings"></div>
      </section>

      <section id="agents" class="tab-content" style="display:none;">
        <h2 class="section-title">Agents for Hire</h2>
        <div id="agentsList" class="listings"></div>
      </section>

      <section id="requests" class="tab-content" style="display:none;">
        <h2 class="section-title">Agent / Buyer Requests</h2>
        <div id="agentRequests" class="listings"></div>
      </section>
    </main>

    <nav class="bottom-nav">
  <a href="#" class="nav-item nav-home" onclick="goHome(); return false;">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </a>
  <a href="chat.html" class="nav-item">
    <i class="fa-solid fa-comments"></i><span>Chat</span>
  </a>
  <a href="settings.html" class="nav-item">
    <i class="fa-solid fa-cog"></i><span>Manage</span>
  </a>
  <a href="#" class="nav-item" onclick="logout(); return false;">
    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
  </a>
</nav>
  </div>

  <!-- PROBLEM: Broken HTML -->
<div id="manageListingsModal" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close-btn" onclick="toggleModal('manageListingsModal', false)">×</button>
    <h3>Manage My Listings</h3>
    <div id="manageListingsContainer"></div>
  </div>
</div>

  <div id="connectedAgents" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('connectedAgents', false)">×</button>
      <h3>Connected Agents</h3>
      <div id="connectedAgentsList"></div>
    </div>
  </div>
  
  <div id="sellerRequest" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="close-btn" onclick="toggleModal('sellerRequest', false)">×</button>
    <h3>Post Request</h3>
    <input id="sellerRequestTitle" placeholder="Request Title">
    <textarea id="sellerRequestDesc" placeholder="What are you looking for?" rows="4"></textarea>
    <select id="sellerRequestType">
      <option value="looking-for-agent">Looking for Agent</option>
      <option value="looking-for-buyer">Looking for Buyer</option>
      <option value="property-valuation">Property Valuation</option>
    </select>
    <input id="sellerRequestBudget" placeholder="Budget (optional)" type="number">
    <input id="sellerRequestLocation" placeholder="Location (optional)">
    <div class="row">
      <button class="btn primary" onclick="postSellerRequest()">Post Request</button>
      <button class="btn ghost" onclick="toggleModal('sellerRequest', false)">Cancel</button>
    </div>
  </div>
</div>

  <script src="script.js" defer></script>

  <script>
    if (typeof createListingDemo === 'undefined') {
      function createListingDemo() {
        const payload = {
          title: document.getElementById('listTitle').value,
          location: document.getElementById('listLocation').value,
          price: document.getElementById('listPrice').value,
          desc: document.getElementById('listDesc').value,
          createdAt: new Date().toISOString()
        };
        console.log('Create listing demo', payload);
        alert('Listing created (demo). Implement server call in script.js');
        toggleModal('createlistings', false);
      }
    }
  </script>
  <script src="js/nav.js"></script>
  <script>
// js/nav.js - Smart Home Navigation
// Include this file in all pages that have the bottom navigation

function goHome() {
  const userRole = localStorage.getItem('userRole');
  const isVerified = localStorage.getItem('verified');
  const userEmail = localStorage.getItem('userEmail');
  
  // If user is logged in and verified, redirect to role-specific dashboard
  if (userEmail && isVerified === 'true') {
    switch (userRole) {
      case 'buyer':
        window.location.href = 'buyer.html';
        break;
      case 'seller':
        window.location.href = 'seller.html';
        break;
      case 'agent':
        window.location.href = 'agent.html';
        break;
      default:
        window.location.href = 'index.html';
    }
  } else {
    // Not logged in or not verified, go to landing page
    window.location.href = 'index.html';
  }
}

// Attach to all home buttons when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
  const homeButtons = document.querySelectorAll('.nav-home, .home-btn, [data-home-btn]');
  homeButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      goHome();
    });
  });
});
</script>
</body>
</html>
