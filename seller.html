<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">    <title>Seller Dashboard - HouseHunters</title>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <link rel="stylesheet" href="css/style.css">    <script src="global.js"></script>    <style>        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }        .btn.card { background: #1a1a1a; border: 1px solid #2e2f32; padding: 16px 8px; display: flex; flex-direction: column; gap: 8px; }        .btn.card i { font-size: 24px; }        .categories { display: flex; gap: 12px; overflow-x: auto; padding: 16px; }        .cat { background: #242526; padding: 8px 20px; border-radius: 40px; text-decoration: none; color: white; white-space: nowrap; }        .tabs { display: flex; border-bottom: 1px solid #2e2f32; }        .tab-btn { flex: 1; background: none; border: none; padding: 12px; color: #6c6f72; cursor: pointer; }        .tab-btn.active { color: white; border-bottom: 2px solid white; }        .tab-content { padding: 16px; }        .listings { display: flex; flex-direction: column; gap: 12px; }        .listing-card { background: #1a1a1a; border-radius: 12px; padding: 16px; border: 1px solid #2e2f32; }        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1000; }        .modal-content { background: #1a1a1a; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; }        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px; margin-bottom: 12px; background: #242526; border: 1px solid #3e3f42; border-radius: 8px; color: white; }        .row { display: flex; gap: 12px; margin-top: 16px; }        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #2e2f32; }        .nav-item { color: #6c6f72; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }        .nav-item i { font-size: 22px; }        .nav-item.active { color: white; }        @media (max-width: 768px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }        .delete-btn { background: #c62828; color: white; border: none; padding: 5px 12px; border-radius: 6px; margin-top: 8px; cursor: pointer; }    </style></head><body>    <div class="app">        <header class="app-header">            <div class="brand"><div class="logo"><i class="fa-solid fa-user"></i></div><div><h1>Seller Dashboard</h1><p class="muted small">Manage your properties</p></div></div>        </header>        <section class="top-actions grid-4">            <button class="btn card" onclick="loadMyListings()"><i class="fa-solid fa-layer-group"></i><span>My Listings</span></button>            <button class="btn card" onclick="openAgentsModal()"><i class="fa-solid fa-user-secret"></i><span>Agents</span></button>            <button class="btn card primary" onclick="location.href='create-listing.html'"><i class="fas fa-plus"></i><span>Create</span></button>            <button class="btn card" onclick="openRequestModal()"><i class="fa-solid fa-paper-plane"></i><span>Request</span></button>        </section>        <main class="main-content">            <div class="categories">                <a class="cat" href="apartments.html">Apartment</a>                <a class="cat" href="standalone.html">Standalone</a>                <a class="cat" href="multires.html">Multires</a>                <a class="cat" href="estate.html">Estate</a>            </div>            <div class="tabs">                <button class="tab-btn active" onclick="openTab('listings')">Listings</button>                <button class="tab-btn" onclick="openInquiriesTab()">Inquiries</button>            </div>            <section id="listings" class="tab-content"><h2>Your Active Listings</h2><div id="myListings" class="listings">Loading...</div></section>            <section id="inquiries" class="tab-content" style="display:none;">              <h2>Buyer Inquiries</h2>              <div id="inquiriesList" class="listings">Loading...</div>            </section>        </main>        <nav class="bottom-nav">            <a href="#" id="smartHomeBtn" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>            <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>        </nav>    </div>    <!-- My Listings Modal -->    <div id="myListingsModal" class="modal">        <div class="modal-content">            <button class="close-btn" onclick="toggleModal('myListingsModal', false)">×</button>            <h3>All My Listings</h3>            <div id="allListingsContainer">Loading...</div>        </div>    </div>    <!-- Agents Modal -->    <div id="agentsModal" class="modal">        <div class="modal-content">            <button class="close-btn" onclick="toggleModal('agentsModal', false)">×</button>            <h3>Available Agents</h3>            <div id="agentsContainer">Loading...</div>        </div>    </div>    <!-- Request Modal -->    <div id="requestModal" class="modal">        <div class="modal-content">            <button class="close-btn" onclick="toggleModal('requestModal', false)">×</button>            <h3>Post Seller Request</h3>            <input id="reqTitle" placeholder="Title">            <textarea id="reqDesc" placeholder="Description" rows="4"></textarea>            <select id="reqType">                <option value="looking-for-agent">Looking for Agent</option>                <option value="looking-for-buyer">Looking for Buyer</option>            </select>            <input id="reqBudget" placeholder="Budget">            <input id="reqLocation" placeholder="Location">            <div class="row">                <button class="btn primary" onclick="postSellerRequest()">Post</button>                <button class="btn ghost" onclick="toggleModal('requestModal', false)">Cancel</button>            </div>        </div>    </div><!-- Inquiry Modal - Works for Agents, Sellers, Buyers --><div id="inquiryModal" class="modal" style="display:none;">    <div class="modal-content">        <button class="close-btn" onclick="toggleModal('inquiryModal', false)">×</button>        <h3>Send Inquiry</h3>        <p><strong>Regarding:</strong> <span id="inquiryPropertyTitle"></span></p>        <input type="hidden" id="inquiryPropertyId">        <input type="hidden" id="inquiryReceiverEmail">        <input type="hidden" id="inquiryReceiverRole">        <textarea id="inquiryMessage" rows="4" placeholder="Type your question here..." style="width:100%; margin:12px 0;"></textarea>        <div class="row">            <button class="btn primary" onclick="sendInquiry()">Send Message</button>            <button class="btn ghost" onclick="toggleModal('inquiryModal', false)">Cancel</button>        </div>    </div></div></div>    <script>        document.addEventListener('DOMContentLoaded', () => {    if (!localStorage.getItem('userEmail')) window.location.href = 'login.html';    loadMyListings();    setupSmartNav();});function openSavedListings() {    toggleModal('manageListings', true);    loadSavedListings();}// When opening inquiries tabfunction openInquiriesTab() {    openTab('inquiries');    loadInquiries();}async function loadMyListings() {    const email = localStorage.getItem('userEmail');    if (!email) return;    try {        const response = await fetch(`${API_BASE}/my-properties/${encodeURIComponent(email)}`);        const data = await response.json();        const listings = data.properties || [];        const container = document.getElementById('myListings');        if (listings.length === 0) { container.innerHTML = '<div class="listing-card">No listings yet. Click Create to add one!</div>'; return; }        container.innerHTML = listings.map(prop => `            <div class="listing-card">                <h3>${escapeHtml(prop.title)}</h3>                <p>Price: P${prop.price?.toLocaleString() || 0}</p>                <p>Location: ${escapeHtml(prop.location)}</p>                <button class="btn small danger" onclick="deleteListing(${prop.id})">Delete</button>            </div>        `).join('');    } catch (error) { console.error(error); }}async function deleteListing(id) {    if (!confirm('Delete this listing?')) return;    const email = localStorage.getItem('userEmail');    try {        await fetch(`${API_BASE}/properties/${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });        alert(' Deleted');        loadMyListings();    } catch (error) { alert('Error'); }}async function postSellerRequest() {    const userEmail = localStorage.getItem('userEmail');    const userName = localStorage.getItem('userName') || 'Seller';    const title = document.getElementById('sellerRequestTitle').value;    const description = document.getElementById('sellerRequestDesc').value;    const type = document.getElementById('sellerRequestType').value;    const budget = document.getElementById('sellerRequestBudget').value;    const location = document.getElementById('sellerRequestLocation').value;    if (!title || !description) { alert('Please fill title and description'); return; }    try {        const response = await fetch(`${API_BASE}/requests`, {            method: 'POST', headers: { 'Content-Type': 'application/json' },            body: JSON.stringify({ title, description, type, budget, location, contactName: userName, postedBy: userEmail })        });        const result = await response.json();        if (result.success) { alert(' Request posted!'); toggleModal('sellerRequest', false); }        else alert(' ' + result.message);    } catch (error) { alert('Network error'); }}window.openTab = openTab;window.loadInquiries = loadInquiries;    </script></body></html>
