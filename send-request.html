<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Send Request - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .request-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
        }
        .form-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #2e2f32;
            position: relative;
        }
        .form-card h3 {
            margin: 20px 0 12px 0;
            font-size: 18px;
        }
        .form-card h3:first-of-type {
            margin-top: 0;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #2e2f32;
            z-index: 100;
        }
        .nav-item {
            color: #6c6f72;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: white;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: white;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .btn.primary {
            background: white;
            color: black;
            width: 100%;
        }
        .btn.primary:hover {
            background: #ddd;
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #2a2a2a;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .auth-head {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-small {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-weight: bold;
            font-size: 20px;
            color: black;
        }
        .subtext {
            color: #888;
            font-size: 14px;
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row input, .form-row select {
            flex: 1;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-badge.buyer { background: #2196f3; color: white; }
        .role-badge.seller { background: #4caf50; color: white; }
        .role-badge.agent { background: #ff9800; color: white; }
    </style>
</head>
<body>
    <div class="request-container">
        <div class="form-card">
            <button class="close-btn" onclick="goBack()">×</button>

            <div class="auth-head">
                <div class="logo-small">HH</div>
                <h1>Post a Request</h1>
                <p class="subtext">Let others know what you're looking for</p>
            </div>

            <form id="sendRequestForm">
                <h3>Request Details</h3>
                <input type="text" id="title" placeholder="Request Title (e.g., Looking for 3-bedroom apartment)" required>
                <textarea id="description" placeholder="Describe what you're looking for in detail..." rows="5" required></textarea>
                
                <div class="form-row">
                    <select id="requestType" required>
                        <option value="">Request Type</option>
                        <option value="looking-for-property">🔍 Looking for Property</option>
                        <option value="looking-for-agent">🤝 Looking for Agent</option>
                        <option value="looking-for-buyer">💰 Looking for Buyer</option>
                        <option value="looking-for-seller">🏠 Looking for Seller</option>
                        <option value="looking-for-tenant">🏢 Looking for Tenant</option>
                        <option value="looking-for-landlord">🏘️ Looking for Landlord</option>
                    </select>
                </div>

                <div class="form-row">
                    <input type="number" id="budget" placeholder="Budget (Pula)">
                    <input type="text" id="location" placeholder="Location (e.g., Gaborone, Francistown)" required>
                </div>

                <h3>Contact Information</h3>
                <input type="text" id="contactName" placeholder="Your Name" required>
                <input type="email" id="contactEmail" placeholder="Your Email" readonly>
                <input type="tel" id="contactPhone" placeholder="Your Phone (Optional)">

                <button class="btn primary" type="submit">Post Request</button>
                <div id="formStatus" class="subtext" style="text-align: center; margin-top: 10px;"></div>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item" id="smartHomeBtn"><i class="fa-solid fa-home"></i><span>Home</span></a>
        <a href="received-requests.html" class="nav-item"><i class="fa-solid fa-inbox"></i><span>Received</span></a>
        <a href="sent-requests.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i><span>Sent</span></a>
        <a href="send-request.html" class="nav-item active"><i class="fa-solid fa-plus"></i><span>New</span></a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    </nav>

    <script>
        const API_BASE = 'https://househunters-backend-1.onrender.com/api';
        
        // Set user email
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName') || '';
        const userRole = localStorage.getItem('userRole') || 'buyer';
        
        // Check login
        if (!userEmail) {
            alert('Please login to post requests');
            window.location.href = 'login.html';
        }
        
        // Set contact email field
        document.getElementById('contactEmail').value = userEmail;
        document.getElementById('contactName').value = userName;
        
        function goBack() {
            const role = localStorage.getItem('userRole') || 'buyer';
            const pages = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
            window.location.href = pages[role] || 'index.html';
        }
        
        document.getElementById('sendRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const requestType = document.getElementById('requestType').value;
            const budget = document.getElementById('budget').value;
            const location = document.getElementById('location').value.trim();
            const contactName = document.getElementById('contactName').value.trim();
            const contactPhone = document.getElementById('contactPhone').value.trim();
            
            if (!title) { alert('Please enter a title'); return; }
            if (!description) { alert('Please enter a description'); return; }
            if (!requestType) { alert('Please select a request type'); return; }
            if (!location) { alert('Please enter a location'); return; }
            if (!contactName) { alert('Please enter your name'); return; }
            
            const statusDiv = document.getElementById('formStatus');
            statusDiv.innerHTML = '⏳ Posting request...';
            statusDiv.style.color = '#ffaa00';
            
            try {
                const response = await fetch(`${API_BASE}/requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        type: requestType,
                        budget: parseFloat(budget) || 0,
                        location: location,
                        contactName: contactName,
                        contactPhone: contactPhone,
                        postedBy: userEmail
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusDiv.innerHTML = '✅ Request posted successfully! Redirecting...';
                    statusDiv.style.color = '#4caf50';
                    setTimeout(() => {
                        window.location.href = 'sent-requests.html';
                    }, 1500);
                } else {
                    statusDiv.innerHTML = '❌ ' + result.message;
                    statusDiv.style.color = '#ef5350';
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '❌ Network error: ' + error.message;
                statusDiv.style.color = '#ef5350';
                alert('Network error: ' + error.message);
            }
        });
        
        // Smart navigation
        document.addEventListener('DOMContentLoaded', function() {
            const homeLinks = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
            const homeBtn = document.getElementById('smartHomeBtn');
            if (homeBtn) homeBtn.href = homeLinks[userRole];
            
            // Apply theme
            const isDark = localStorage.getItem('darkMode') !== 'false';
            if (isDark) {
                document.body.style.backgroundColor = '#000000';
            }
        });
    </script>
</body>
</html>
