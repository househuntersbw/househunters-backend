<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Settings - HouseHunters</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .header {
            background: #1a1a1a;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 24px; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        
        /* Profile Section */
        .profile-section {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #2e2f32;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #242526;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid #ffffff;
            position: relative;
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-pic .placeholder {
            font-size: 48px;
            color: #6c6f72;
        }
        .profile-pic .camera-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .profile-email {
            color: #6c6f72;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .edit-profile-btn {
            background: #242526;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        
        /* Settings Cards */
        .settings-card {
            background: #1a1a1a;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #2e2f32;
            overflow: hidden;
        }
        .card-header {
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            font-weight: 600;
        }
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #2e2f32;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-item:last-child { border-bottom: none; }
        .settings-item:hover { background: #242526; }
        .settings-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .settings-item-left i {
            width: 24px;
            color: #6c6f72;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3a3a;
            transition: 0.3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ffffff; }
        input:checked + .slider:before { transform: translateX(26px); background-color: #000000; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #2e2f32;
        }
        .nav-item {
            color: #6c6f72;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: white; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 350px;
        }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #242526;
            border: 1px solid #3e3f42;
            border-radius: 8px;
            color: white;
            margin-bottom: 16px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .save-btn { background: white; color: black; border: none; }
        .cancel-btn { background: #242526; color: white; border: none; }
        
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Settings</h1>
    </div>
    
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-section" id="profileSection">
            <div class="profile-pic" id="profilePicBtn">
                <img id="profileImage" src="" alt="Profile" style="display: none;">
                <div id="profilePlaceholder" class="placeholder"><i class="fa-regular fa-user"></i></div>
                <div class="camera-overlay"><i class="fa-solid fa-camera"></i></div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <div class="profile-name" id="profileName">Loading...</div>
            <div class="profile-email" id="profileEmail">loading@example.com</div>
            <button class="edit-profile-btn" onclick="openEditModal()">Edit Profile</button>
        </div>
        
        <!-- Preferences -->
        <div class="settings-card">
            <div class="card-header">Preferences</div>
            <div class="settings-item">
                <div class="settings-item-left">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notifications</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="notificationsSwitch">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="settings-item">
                <div class="settings-item-left">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark Mode</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkModeSwitch" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <!-- Account -->
        <div class="settings-card">
            <div class="card-header">Account</div>
            <div class="settings-item" onclick="openChangePasswordModal()">
                <div class="settings-item-left">
                    <i class="fa-solid fa-key"></i>
                    <span>Change Password</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #6c6f72;"></i>
            </div>
            <div class="settings-item" onclick="logout()">
                <div class="settings-item-left">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>Logout</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #6c6f72;"></i>
            </div>
            <div class="settings-item" onclick="confirmDeleteAccount()">
                <div class="settings-item-left">
                    <i class="fa-solid fa-trash"></i>
                    <span style="color: #ff4444;">Delete Account</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #6c6f72;"></i>
            </div>
        </div>
    </div>
    
    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Edit Profile</h3>
            <input type="text" id="editName" placeholder="Full Name">
            <input type="text" id="editPhone" placeholder="Phone Number">
            <input type="text" id="editLocation" placeholder="Location">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                <button class="save-btn" onclick="saveProfile()">Save</button>
            </div>
        </div>
    </div>
    
    <!-- Change Password Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>Change Password</h3>
            <input type="password" id="currentPassword" placeholder="Current Password">
            <input type="password" id="newPassword" placeholder="New Password (min 6 chars)">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closePasswordModal()">Cancel</button>
                <button class="save-btn" onclick="changePassword()">Update</button>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <nav class="bottom-nav">
        <a href="buyer.html" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
        <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
        <a href="settings.html" class="nav-item active"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
    </nav>

    <script>
        const API_BASE = 'https://househunters-backend-1.onrender.com/api';
        let currentUser = null;
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? '#c62828' : '#2e7d32';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
        
        async function loadUserData() {
            const email = localStorage.getItem('userEmail');
            if (!email) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = { email };
            
            try {
                const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(email)}`);
                const data = await response.json();
                if (data.success) {
                    const user = data.user;
                    document.getElementById('profileName').textContent = user.name || 'User';
                    document.getElementById('profileEmail').textContent = user.email;
                    document.getElementById('editName').value = user.name || '';
                    document.getElementById('editPhone').value = user.phone || '';
                    document.getElementById('editLocation').value = user.location || '';
                    
                    // Load profile picture
                    loadProfilePicture(email);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        async function loadProfilePicture(email) {
            try {
                const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(email)}/picture`);
                const data = await response.json();
                if (data.success && data.imageUrl) {
                    const img = document.getElementById('profileImage');
                    const placeholder = document.getElementById('profilePlaceholder');
                    img.src = `https://househunters-backend-1.onrender.com${data.imageUrl}`;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                } else {
                    document.getElementById('profileImage').style.display = 'none';
                    document.getElementById('profilePlaceholder').style.display = 'flex';
                }
            } catch (error) {
                console.error('Error loading profile picture:', error);
            }
        }
        
        // Profile picture upload
        document.getElementById('profilePicBtn').onclick = () => {
            document.getElementById('fileInput').click();
        };
        
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Please select an image file', true);
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                showToast('Image must be less than 2MB', true);
                return;
            }
            
            const formData = new FormData();
            formData.append('profilePic', file);
            
            try {
                const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUser.email)}/picture`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Profile picture updated!');
                    loadProfilePicture(currentUser.email);
                } else {
                    showToast('Failed to upload', true);
                }
            } catch (error) {
                showToast('Network error', true);
            }
        };
        
        function openEditModal() {
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function saveProfile() {
            const name = document.getElementById('editName').value;
            const phone = document.getElementById('editPhone').value;
            const location = document.getElementById('editLocation').value;
            
            if (!name) {
                showToast('Name is required', true);
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUser.email)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, location })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Profile updated!');
                    document.getElementById('profileName').textContent = name;
                    localStorage.setItem('userName', name);
                    closeEditModal();
                } else {
                    showToast('Update failed', true);
                }
            } catch (error) {
                showToast('Network error', true);
            }
        }
        
        function openChangePasswordModal() {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('passwordModal').style.display = 'flex';
        }
        
        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }
        
        async function changePassword() {
            const currentPwd = document.getElementById('currentPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            
            if (!currentPwd || !newPwd) {
                showToast('Please fill all fields', true);
                return;
            }
            if (newPwd.length < 6) {
                showToast('New password must be at least 6 characters', true);
                return;
            }
            if (newPwd !== confirmPwd) {
                showToast('Passwords do not match', true);
                return;
            }
            
            // First login with current password to verify
            try {
                const loginResponse = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: currentUser.email, password: currentPwd })
                });
                const loginResult = await loginResponse.json();
                if (!loginResult.success) {
                    showToast('Current password is incorrect', true);
                    return;
                }
                
                // Update password
                const response = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUser.email, otp: 'verified', newPassword: newPwd })
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Password changed successfully!');
                    closePasswordModal();
                } else {
                    showToast('Failed to change password', true);
                }
            } catch (error) {
                showToast('Network error', true);
            }
        }
        
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        function confirmDeleteAccount() {
            if (confirm('⚠️ WARNING: This will permanently delete your account and all your listings. This action cannot be undone. Are you sure?')) {
                if (confirm('Please confirm again: Type "DELETE" to proceed')) {
                    const confirmation = prompt('Type DELETE to confirm:');
                    if (confirmation === 'DELETE') {
                        deleteAccount();
                    }
                }
            }
        }
        
        async function deleteAccount() {
            try {
                const response = await fetch(`${API_BASE}/profile/${encodeURIComponent(currentUser.email)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.success) {
                    showToast('Account deleted');
                    setTimeout(() => { logout(); }, 1500);
                } else {
                    showToast('Failed to delete account', true);
                }
            } catch (error) {
                showToast('Network error', true);
            }
        }
        
        // Add DELETE endpoint to your server.js
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            
            // Load saved preferences
            const notifications = localStorage.getItem('notifications') === 'true';
            document.getElementById('notificationsSwitch').checked = notifications;
            
            document.getElementById('notificationsSwitch').onchange = (e) => {
                localStorage.setItem('notifications', e.target.checked);
                showToast(e.target.checked ? 'Notifications on' : 'Notifications off');
            };
        });
    </script>
</body>
</html>
