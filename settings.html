<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings — HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-cog"></i></div>
        <div>
          <h1>Settings</h1>
          <p class="muted small">Manage account preferences</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="settings-section">
        <h2 class="section-title">Profile</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-user-circle icon"></i><span>Edit Profile</span></div>
            <button class="btn small" onclick="location.href='profile.html'">Edit</button>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-key icon"></i><span>Change Password</span></div>
            <button class="btn small ghost">Update</button>
          </div>
        </div>

        <h2 class="section-title">App Preferences</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-bell icon"></i><span>Notifications</span></div>
            <label class="switch">
              <input type="checkbox" id="notificationsSwitch" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-moon icon"></i><span>Dark Mode</span></div>
            <label class="switch">
              <input type="checkbox" id="lightModeSwitch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <h2 class="section-title">Account</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-sign-out-alt icon"></i><span>Logout</span></div>
            <button class="btn small danger" onclick="location.href='index.html'">Logout</button>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-trash icon"></i><span>Delete Account</span></div>
            <button class="btn small danger ghost">Delete</button>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="buyer.html" class="nav-item"><i class="fa-solid fa-home"></i><span>Home</span></a>
      <a href="chat.html" class="nav-item"><i class="fa-solid fa-comments"></i><span>Chat</span></a>
      <a href="settings.html" class="nav-item active"><i class="fa-solid fa-cog"></i><span>Settings</span></a>
    </nav>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
