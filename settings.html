<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings — HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-cog"></i></div>
        <div>
          <h1>Settings</h1>
          <p class="muted small">Manage account preferences</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="settings-section">
        <h2 class="section-title">Profile</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-user-circle icon"></i><span>Edit Profile</span></div>
            <button class="btn small" onclick="location.href='profile.html'">Edit</button>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-key icon"></i><span>Change Password</span></div>
            <button class="btn small ghost">Update</button>
          </div>
        </div>

        <h2 class="section-title">App Preferences</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-bell icon"></i><span>Notifications</span></div>
            <label class="switch">
              <input type="checkbox" id="notificationsSwitch" checked>
              <span class="slider"></span>
            </label>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-moon icon"></i><span>Dark Mode</span></div>
            <label class="switch">
              <input type="checkbox" id="lightModeSwitch">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <h2 class="section-title">Account</h2>
        <div class="settings-card">
          <div class="settings-item">
            <div><i class="fa-solid fa-sign-out-alt icon"></i><span>Logout</span></div>
            <button class="btn small danger" onclick="location.href='index.html'">Logout</button>
          </div>

          <div class="settings-item">
            <div><i class="fa-solid fa-trash icon"></i><span>Delete Account</span></div>
            <button class="btn small danger ghost">Delete</button>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
  <a href="#" class="nav-item nav-home" onclick="goHome(); return false;">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </a>
  <a href="chat.html" class="nav-item">
    <i class="fa-solid fa-comments"></i><span>Chat</span>
  </a>
  <a href="settings.html" class="nav-item">
    <i class="fa-solid fa-cog"></i><span>Manage</span>
  </a>
  <a href="#" class="nav-item" onclick="logout(); return false;">
    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
  </a>
</nav>
  </div>
<script src="js/nav.js"></script>
  <script src="script.js" defer></script>
  <script>
// js/nav.js - Smart Home Navigation
// Include this file in all pages that have the bottom navigation

function goHome() {
  const userRole = localStorage.getItem('userRole');
  const isVerified = localStorage.getItem('verified');
  const userEmail = localStorage.getItem('userEmail');
  
  // If user is logged in and verified, redirect to role-specific dashboard
  if (userEmail && isVerified === 'true') {
    switch (userRole) {
      case 'buyer':
        window.location.href = 'buyer.html';
        break;
      case 'seller':
        window.location.href = 'seller.html';
        break;
      case 'agent':
        window.location.href = 'agent.html';
        break;
      default:
        window.location.href = 'index.html';
    }
  } else {
    // Not logged in or not verified, go to landing page
    window.location.href = 'index.html';
  }
}

// Attach to all home buttons when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
  const homeButtons = document.querySelectorAll('.nav-home, .home-btn, [data-home-btn]');
  homeButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      goHome();
    });
  });
});
</script>
</body>
</html>
