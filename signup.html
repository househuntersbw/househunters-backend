<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account — HouseHunters Botswana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container auth-card">
    <button class="close-btn" onclick="location.href='index.html'">×</button>
    <h1>Create Account</h1>
    <p class="subtext">Choose your account type and sign up</p>

    <div class="role-selector">
      <button class="role-btn" data-role="buyer">Buyer</button>
      <button class="role-btn" data-role="seller">Seller</button>
      <button class="role-btn" data-role="agent">Agent</button>
    </div>

    <form id="signupForm" class="stack" autocomplete="on" novalidate>
      <input type="text" id="name" placeholder="Full name" required>
      <input type="email" id="email" placeholder="Email address" required>
      <input type="tel" id="phone" placeholder="+26771234567" pattern="\+2677[0-9]{7}" required>
      <small class="muted">Format: +2677XXXXXXX (Botswana number)</small>
      <input type="password" id="password" placeholder="Password (min 6 characters)" required minlength="6">
      <input type="text" id="location" placeholder="Your location in Botswana" required>
      <button class="btn primary" type="submit">Create Account</button>
    </form>
    <p class="back small muted">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
  const API_BASE = 'https://househunters-backend-1.onrender.com';

  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('signupForm');
    const roleBtns = document.querySelectorAll('.role-btn');
    
    roleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        roleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    
    if (form) {
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const activeRole = document.querySelector('.role-btn.active');
        const role = activeRole ? activeRole.dataset.role : 'buyer';
        const phone = document.getElementById('phone').value;
        
        if (!/^\+2677\d{7}$/.test(phone)) {
          alert('❌ Please use a valid Botswana number: +2677XXXXXXX');
          return;
        }
        
        const formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: phone,
          password: document.getElementById('password').value,
          location: document.getElementById('location').value,
          role: role
        };

        try {
          const response = await fetch(`${API_BASE}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          const result = await response.json();

          if (result.success) {
            localStorage.setItem('pendingVerification', formData.email);
            localStorage.setItem('userEmail', formData.email);
            localStorage.setItem('userRole', role);
            localStorage.setItem('userName', formData.name);
            alert('✅ Registration successful! You can now login.');
            window.location.href = 'login.html';
          } else {
            alert('❌ Registration failed: ' + result.message);
          }
        } catch (error) {
          alert('❌ Network error: ' + error.message);
        }
      });
    }
  });
  </script>
</body>
</html>
