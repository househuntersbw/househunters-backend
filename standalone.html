<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Standalone Homes — HouseHunters</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-house-chimney"></i></div>
        <div>
          <h1>Standalone</h1>
          <p class="muted small">Stand-alone houses & family homes</p>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="top-actions">
        <button class="btn primary" onclick="toggleModal('newRequest', true)">Post Request</button>
      </div>

      <div class="categories horizontal-scroll">
        <a class="cat" href="apartments.html">Apartment</a>
        <a class="cat active" href="standalone.html">Standalone</a>
        <a class="cat" href="multires.html">Multires</a>
        <a class="cat" href="estate.html">Estate</a>
      </div>

      <h2 class="section-title">Featured Standalone Homes</h2>
      <div id="featuredListings" class="listings"></div>

      <h2 class="section-title">All Standalone Listings</h2>
      <div id="allListings" class="listings"></div>
    </main>

    <nav class="bottom-nav">
  <a href="#" class="nav-item nav-home" onclick="goHome(); return false;">
    <i class="fa-solid fa-house"></i><span>Home</span>
  </a>
  <a href="chat.html" class="nav-item">
    <i class="fa-solid fa-comments"></i><span>Chat</span>
  </a>
  <a href="settings.html" class="nav-item">
    <i class="fa-solid fa-cog"></i><span>Manage</span>
  </a>
  <a href="#" class="nav-item" onclick="logout(); return false;">
    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
  </a>
</nav>
  </div>

  <div id="newRequest" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" onclick="toggleModal('newRequest', false)">×</button>
      <h3>Post New Standalone Request</h3>
      <input id="newTitle" placeholder="Property Title">
      <input id="newOwner" placeholder="Owner Name">
      <input id="newManager" placeholder="Managed By">
      <textarea id="newDesc" placeholder="Description"></textarea>
      <div class="row">
        <button class="btn primary" onclick="postNewRequest('standalone')">Post</button>
        <button class="btn ghost" onclick="toggleModal('newRequest', false)">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
  <script>
  
  // Updated postNewRequest function for property pages
async function postNewRequest(type) {
  const userEmail = localStorage.getItem('userEmail');
  const userName = localStorage.getItem('userName') || 'User';
  
  if (!userEmail) {
    alert('❌ Please login to post requests');
    window.location.href = 'login.html';
    return;
  }

  const title = document.getElementById('newTitle')?.value || '';
  const description = document.getElementById('newDesc')?.value || '';
  
  if (!title || !description) {
    alert('❌ Please fill in title and description');
    return;
  }

  const payload = {
    title: title,
    description: description,
    type: `looking-for-${type}`,
    budget: 0,
    location: 'Botswana',
    contactName: userName,
    postedBy: userEmail
  };

  try {
    const response = await fetch('/https://househunters-backend-1.onrender.com/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    
    const result = await response.json();
    
    if (result.success) {
      alert('✅ Request posted successfully!');
      toggleModal('newRequest', false);
      
      // Clear form
      document.getElementById('newTitle').value = '';
      document.getElementById('newOwner').value = '';
      document.getElementById('newManager').value = '';
      document.getElementById('newDesc').value = '';
    } else {
      alert('❌ ' + result.message);
    }
  } catch (error) {
    alert('❌ Network error: ' + error.message);
  }
}

  // Real API call
  fetch('/https://househunters-backend-1.onrender.com/requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(response => response.json())
  .then(result => {
    if (result.success) {
      alert('✅ Request posted successfully!');
      toggleModal('newRequest', false);
      
      // Clear form
      document.getElementById('newTitle').value = '';
      document.getElementById('newOwner').value = '';
      document.getElementById('newManager').value = '';
      document.getElementById('newDesc').value = '';
    } else {
      alert('❌ ' + result.message);
    }
  })
  .catch(error => {
    alert('❌ Network error: ' + error.message);
  });
}
</script>
<script src="js/nav.js"></script>
<script>
// js/nav.js - Smart Home Navigation
// Include this file in all pages that have the bottom navigation

function goHome() {
  const userRole = localStorage.getItem('userRole');
  const isVerified = localStorage.getItem('verified');
  const userEmail = localStorage.getItem('userEmail');
  
  // If user is logged in and verified, redirect to role-specific dashboard
  if (userEmail && isVerified === 'true') {
    switch (userRole) {
      case 'buyer':
        window.location.href = 'buyer.html';
        break;
      case 'seller':
        window.location.href = 'seller.html';
        break;
      case 'agent':
        window.location.href = 'agent.html';
        break;
      default:
        window.location.href = 'index.html';
    }
  } else {
    // Not logged in or not verified, go to landing page
    window.location.href = 'index.html';
  }
}

// Attach to all home buttons when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
  const homeButtons = document.querySelectorAll('.nav-home, .home-btn, [data-home-btn]');
  homeButtons.forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      goHome();
    });
  });
});
</script>
</body>
</html>
