<!DOCTYPE html>
<html>
<head>
  <title>Verification Successful - HouseHunters</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="global.js"></script>
</head>
<body>
  <div class="container auth-card">
    <div style="text-align: center; padding: 40px;">
      <div style="font-size: 4rem; margin-bottom: 20px;">🎉</div>
      <h1>Account Verified!</h1>
      <p>Your account has been successfully verified.</p>
      <p>Redirecting to your dashboard...</p>
      <div id="countdown" style="font-size: 2rem; margin: 20px 0;">3</div>
      <button onclick="redirectNow()" class="btn primary">Go Now</button>
    </div>
  </div>

  <script>
    let count = 3;
    const countdown = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      count--;
      countdown.textContent = count;
      if (count === 0) {
        clearInterval(timer);
        redirectNow();
      }
    }, 1000);
    
    function redirectNow() {
      const role = localStorage.getItem('userRole') || 'buyer';
      const pages = { buyer: 'buyer.html', seller: 'seller.html', agent: 'agent.html' };
      window.location.href = pages[role] || 'index.html';
    }
  </script>
</body>
</html>
