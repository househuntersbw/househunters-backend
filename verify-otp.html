<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verify Account — HouseHunters Botswana</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
  <div class="container auth-card">
    <button class="close-btn" onclick="location.href='index.html'">×</button>

    <div class="auth-head">
      <div class="logo-small">HH</div>
      <h1>Verify Your Account</h1>
      <p class="subtext">Enter the OTP sent to your email</p>
    </div>

    <form id="verifyOtpForm" class="stack">
      <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
      
      <div id="otpStatus" class="small muted"></div>
      
      <button class="btn primary" type="submit">Verify Account</button>
    </form>

    <div class="resend-otp">
      <p class="small muted">Didn't receive the code?</p>
      <button id="resendOtp" class="btn ghost small">Resend OTP</button>
      <p id="resendStatus" class="small" style="margin-top: 10px;"></p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const verifyForm = document.getElementById('verifyOtpForm');
      const resendBtn = document.getElementById('resendOtp');
      const otpStatus = document.getElementById('otpStatus');
      const resendStatus = document.getElementById('resendStatus');

      // Verify OTP Form Submission
      verifyForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = localStorage.getItem('pendingVerification') || localStorage.getItem('userEmail');
        const otp = document.getElementById('otp').value.trim();

        if (!email) {
          otpStatus.innerHTML = '❌ No email found. Please register again.';
          otpStatus.style.color = 'red';
          return;
        }

        if (!otp || otp.length !== 6) {
          otpStatus.innerHTML = '❌ Please enter a valid 6-digit OTP';
          otpStatus.style.color = 'red';
          return;
        }

        otpStatus.innerHTML = '⏳ Verifying...';
        otpStatus.style.color = 'blue';

        try {
          const response = await fetch('/https://househunters-backend.onrender.com/verify-otp', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email, otp: otp })
          });

          const result = await response.json();

          if (result.success) {
            otpStatus.innerHTML = '✅ ' + result.message;
            otpStatus.style.color = 'green';

            // Store user data
            localStorage.setItem('userEmail', email);
            localStorage.setItem('verified', 'true');
            localStorage.setItem('userName', result.user.name);
            localStorage.setItem('userRole', result.user.role);

            // Clear pending verification
            localStorage.removeItem('pendingVerification');

            // Redirect to verification success page
            setTimeout(() => {
              window.location.href = 'verification-success.html';
            }, 1500);

          } else {
            otpStatus.innerHTML = '❌ ' + result.message;
            otpStatus.style.color = 'red';
          }
        } catch (error) {
          otpStatus.innerHTML = '❌ Network error: ' + error.message;
          otpStatus.style.color = 'red';
        }
      });

      // Resend OTP functionality
      resendBtn.addEventListener('click', async function() {
        const email = localStorage.getItem('pendingVerification') || localStorage.getItem('userEmail');
        
        if (!email) {
          resendStatus.innerHTML = '❌ No email found. Please register again.';
          resendStatus.style.color = 'red';
          return;
        }
        
        resendStatus.innerHTML = '⏳ Sending...';
        resendStatus.style.color = 'blue';
        
        try {
          const response = await fetch('/https://househunters-backend.onrender.com/resend-otp', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email })
          });
          
          const result = await response.json();
          
          if (result.success) {
            resendStatus.innerHTML = '✅ ' + result.message;
            resendStatus.style.color = 'green';
          } else {
            resendStatus.innerHTML = '❌ ' + result.message;
            resendStatus.style.color = 'red';
          }
        } catch (error) {
          resendStatus.innerHTML = '❌ Network error: ' + error.message;
          resendStatus.style.color = 'red';
        }
      });
    });
  </script>
</body>
</html>
